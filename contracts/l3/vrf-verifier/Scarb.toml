[package]
name = "realms_vrf_verifier"
version = "0.1.0"
edition = "2024_07"
cairo-version = "=2.17.0"
license = "MIT"

[dependencies]
starknet = "=2.17.0"

[dev-dependencies]
snforge_std = "=0.64.0"

[[target.starknet-contract]]
sierra = true
casm = true

[lib]

[tool.fmt]
max-line-length = 120
sort-module-level-items = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
