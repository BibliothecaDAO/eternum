[package]
name = "world_native"
version = "0.1.0"
edition = "2024_07"
cairo-version = "=2.13.1"

[dependencies]
starknet = "=2.13.1"
eternum_randomness_protocol = { path = "../randomness-protocol" }

[dev-dependencies]
snforge_std = "=0.52.0"
assert_macros = "=2.13.1"

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = ["eternum_randomness_protocol::authority::SequencingAccount"]

[scripts]
test = "snforge test"
schema = "scarb build && bun scripts/generate-schema.mjs"

[tool.fmt]
max-line-length = 120
sort-module-level-items = true
