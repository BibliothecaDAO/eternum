test = []

[package]
name = "world_native"
version = "0.1.0"
edition = "2024_07"
cairo-version = "=2.17.0"

[features]
test_support = []

[dependencies]
starknet = "=2.17.0"
eternum_cubit = { path = "vendor/cubit" }
games_storage = { path = "storage" }
realms_vrf_verifier = { path = "../vrf-verifier" }

[lib]

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = ["realms_vrf_verifier::Verifier"]

[scripts]
test = "bash ../test-native.sh"
schema = "scarb build && bun scripts/generate-schema.mjs"

[tool.fmt]
max-line-length = 120
sort-module-level-items = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
