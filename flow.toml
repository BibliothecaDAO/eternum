[project]
setup = "pnpm install --frozen-lockfile --prefer-offline"

[kind.build]
cmd = "bash contracts/l3/check-native.sh build"
estimate_gb = 9

[kind.sizes]
cmd = "bash contracts/l3/check-native.sh sizes"
measure = 'cd contracts/l3/world-native && node scripts/check-class-sizes.mjs | jq -r ".headroomLimit as \$l | [.classes[] | .name + \" \" + (.felts | tostring) + \" of \" + (\$l | tostring)] | join(\", \")"'
paths = "contracts/ .tool-versions"
estimate_gb = 9

[kind.gate-prelude]
paths = "contracts/ .tool-versions"
cmd = "bash contracts/l3/check-native.sh prelude"
estimate_gb = 5

[kind.gate-vrf]
paths = "contracts/ .tool-versions"
cmd = "bash contracts/l3/check-native.sh vrf"
estimate_gb = 9

[kind.gate-world]
paths = "contracts/ .tool-versions"
cmd = "bash contracts/l3/check-native.sh world"
estimate_gb = 9

[kind.gate-drift]
cmd = "bash contracts/l3/check-native.sh drift"
paths = "contracts/ config/ packages/ apps/herald/src/native/ package.json pnpm-lock.yaml .tool-versions"
estimate_gb = 9

[kind.gate-events]
paths = "contracts/ .tool-versions"
cmd = "bash contracts/l3/check-native.sh events"
estimate_gb = 9

[kind.test-capture]
cmd = "bash contracts/l3/check-native.sh test-capture"
measure = 'grep -oE "Tests: [0-9]+ passed" "$FLOW_LOG" | tail -n 1'
paths = "contracts/ .tool-versions !contracts/l3/world-native/tests/combat/ !contracts/l3/world-native/tests/discovery/ !contracts/l3/world-native/tests/discovery-roots/ !contracts/l3/world-native/tests/economy/ !contracts/l3/world-native/tests/lifecycle/ !contracts/l3/world-native/tests/registration/ !contracts/l3/world-native/tests/resources/ !contracts/l3/world-native/tests/world/"
estimate_gb = 9

[kind.test-combat]
cmd = "bash contracts/l3/check-native.sh test-combat"
