measure = 'awk "/Tests: [0-9]+ passed/ {sum += \$2} END {print sum}" "$FLOW_LOG" | xargs -I{} echo Tests: {} passed'
paths = "contracts/ .tool-versions !contracts/l3/world-native/tests/capture/ !contracts/l3/world-native/tests/combat/ !contracts/l3/world-native/tests/economy/ !contracts/l3/world-native/tests/lifecycle/ !contracts/l3/world-native/tests/registration/ !contracts/l3/world-native/tests/resources/ !contracts/l3/world-native/tests/world/"
