# Daily 1h blitz game at 11:00 UTC (13:00 Paris summer time). Games are named
# blitz-herald-0001, blitz-herald-0002, ... and created ~24h before their start
# (advance window 1), with settling open from creation. The blitz-rotation-tick
# workflow evaluates this rotation every 30 minutes.
# DST flips are manual: re-dispatch game-launch with a shifted utcTime cadence.
launchKind: rotation
environmentId: appchain.blitz
rotationName: blitz-herald
firstGameStartTime: 2026-08-19T11:00:00Z
maxGames: 365
advanceWindowGames: 1
evaluationIntervalMinutes: 30
autoRetryEnabled: true
autoRetryIntervalMinutes: 15
durationSeconds: 3600
version: "6"

weeklyCadence:
  - { weekday: monday, utcTime: "11:00" }
  - { weekday: tuesday, utcTime: "11:00" }
  - { weekday: wednesday, utcTime: "11:00" }
  - { weekday: thursday, utcTime: "11:00" }
  - { weekday: friday, utcTime: "11:00" }
  - { weekday: saturday, utcTime: "11:00" }
  - { weekday: sunday, utcTime: "11:00" }
