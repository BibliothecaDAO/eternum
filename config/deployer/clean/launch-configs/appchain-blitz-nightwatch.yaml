# Daily 1h blitz game at 20:00 UTC (22:00 Paris summer time). Games are named
# blitz-nightwatch-0001, blitz-nightwatch-0002, ... and created ~24h before
# their start (advance window 1), with settling open from creation. The
# blitz-rotation-tick workflow evaluates this rotation every 30 minutes.
# DST flips are manual: re-dispatch game-launch with a shifted utcTime cadence.
launchKind: rotation
environmentId: appchain.blitz
rotationName: blitz-nightwatch
firstGameStartTime: 2026-08-19T20:00:00Z
maxGames: 365
advanceWindowGames: 1
evaluationIntervalMinutes: 30
autoRetryEnabled: true
autoRetryIntervalMinutes: 15
durationSeconds: 3600
version: "6"

weeklyCadence:
  - { weekday: monday, utcTime: "20:00" }
  - { weekday: tuesday, utcTime: "20:00" }
  - { weekday: wednesday, utcTime: "20:00" }
  - { weekday: thursday, utcTime: "20:00" }
  - { weekday: friday, utcTime: "20:00" }
  - { weekday: saturday, utcTime: "20:00" }
  - { weekday: sunday, utcTime: "20:00" }
