packages:
  - client
  - client/apps/game
  - client/apps/realtime-server
  - client/apps/game-docs
  - client/apps/heavy-load
  - client/apps/eternum-mobile
  - client/apps/onchain-agent
  - client/apps/amm-indexerv2
  - config
  - packages/*
  - contracts/season_pass/ext/scripts/deployment
  - contracts/season_resources/ext/scripts/deployment
  - scripts/lords-distribution

autoInstallPeers: true

# Patches @dojoengine/utils@1.8.4 to drop the `addAddressPadding` call inside
# `getEntityIdFromKeys`. Torii 1.8 returns `hashed_keys` without leading-zero padding to
# felt252 width, so the padded lookup never matched what RECS stored. Reverting the pad
# call brings client-side entity ID derivation back in sync with server output.
patchedDependencies:
  "@dojoengine/utils@1.8.4": patches/@dojoengine__utils@1.8.4.patch

catalog:
  "@cartridge/connector": ^0.13.9
  "@cartridge/controller": ^0.13.9
