name: Check out without media
description: >-
  Widen the checkout before it, which fetches only .github/actions, to every file but the binary media: images, models,
  Blender sources, sound and video, 1.23 GB of the 1.31 GB tree. No step of a job that uses this reads one, and a step
  that starts to fails with ENOENT. The full tree's fetch took about a minute on a normal day and up to ten while
  GitHub's git service was slow, enough to time a job out; this fetches about 80 MB.
runs:
  using: composite
  steps:
    - name: Check out every file but the media
      shell: bash
      run: |
        git sparse-checkout set --no-cone --stdin <<'PATTERNS'
        /*
        !*.png
        !*.webp
        !*.jpg
        !*.gif
        !*.glb
        !*.blend
        !*.mp3
        !*.wav
        !*.mp4
        PATTERNS
