name: Check out without media
description: >-
  Widen the checkout before it, which fetches only .github/actions, to every file but the binary media (images, models,
  Blender sources, sound and video: 1.25 GB of the 1.32 GB tree), plus the media the job lists in `keep`. A step that
  reads any other media fails with ENOENT. The full tree's fetch took about a minute on a normal day and up to ten while
  GitHub's git service was slow, enough to time a job out; without media this fetches about 80 MB.
inputs:
  keep:
    description: >-
      Media the job reads, one path per line from the repository root: a file, or a folder with everything under it.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check out every file but the media the job does not read
      shell: bash
      env:
        KEEP: ${{ inputs.keep }}
      run: bash "$GITHUB_ACTION_PATH/set-sparse-checkout.sh"
