name: test-contracts

on:
  push:
    branches:
      - next
    paths:
      - "contracts/l3/game/**"
      - "packages/core/src/data/full-realms.json"
      - "scripts/generate-realm-metadata.py"
      - "config/source/**"
      - "config/deployer/clean/**"
      - ".github/workflows/test-contracts.yml"
  pull_request:
    paths:
      - "contracts/l3/game/**"
      - "packages/core/src/data/full-realms.json"
      - "scripts/generate-realm-metadata.py"
      - "config/source/**"
      - "config/deployer/clean/**"
      - ".github/workflows/test-contracts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

  test-various:
    needs: [setup-environment]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # strategy:
    #   matrix:
    #     # Only troop_management has active tests (40 tests)
    #     # Disabled jobs that run 0 tests:
    #     # - models: all tests commented out
    #     # - test_troop_movement: all tests commented out
    #     # - test_troop_battle: all tests commented out
    #     # - quest: tests behind #[cfg(feature: 'budokan_tests')] - budokan dependency commented out
    #     #
    #     # Note: Parallelization by test group (guard_, explorer_create, etc.) was analyzed
    #     # but not implemented because compilation overhead (~3min) per job would increase
    #     # total CI time. With 40 tests in single job, compilation is done once.
    #     # See contracts/l3/game/src/systems/combat/contracts/TEST_ANALYSIS.md for details.
    #     test: [troop_management]
    # fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - uses: software-mansion/setup-scarb@v1
        with:
          tool-versions: contracts/l3/game/.tool-versions
      - uses: foundry-rs/setup-snfoundry@v3
        with:
          tool-versions: contracts/l3/game/.tool-versions
      - name: Verify deployment does not require sozo
        run: "! command -v sozo"
      - name: Run Dojo Test
        run: |
          cd contracts/l3/game && scarb test

  test-scarb-fmt:
    needs: [setup-environment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.13.1"
      - name: Check canonical realm metadata
        run: python3 scripts/generate-realm-metadata.py --check
      - name: Run scarb fmt check
        run: cd contracts/l3/game && scarb fmt --check

  test-world-deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify world deployment without sozo
        run: |
          ! command -v sozo
          bun test config/deployer/clean/tests/world-deployment.test.ts
