name: release-game

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-game
  cancel-in-progress: false

jobs:
  release:
    name: create-game-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${VERSION}"

      - name: Get latest release tag
        id: latest_tag
        run: |
          LATEST_TAG=$(git tag -l 'game-v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "No previous release tag found, using initial commit"
          fi
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST_TAG}"

      - name: Determine version bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUMP: ${{ inputs.bump }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BUMP="$INPUT_BUMP"
          else
            BUMP="patch"
            MERGE_PR=$(gh pr list --state merged --base main --limit 1 --json number,labels --jq '.[0]')
            if [ -n "$MERGE_PR" ]; then
              LABELS=$(echo "$MERGE_PR" | jq -r '.labels[].name // empty')
              if echo "$LABELS" | grep -q "release:major"; then
                BUMP="major"
              elif echo "$LABELS" | grep -q "release:minor"; then
                BUMP="minor"
              fi
            fi
          fi
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Bump type: ${BUMP}"

      - name: Calculate new version
        id: new_version
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          BUMP_TYPE: ${{ steps.bump.outputs.bump }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_VERSION}"

      - name: Write release notes from the commit log
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Changes"
            echo ""
            git log "${LATEST_TAG}..HEAD" --no-merges --format='- %s (%h)'
            echo ""
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${LATEST_TAG}...game-v${NEW_VERSION}"
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version in package.json
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.NEW_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump game version to v${NEW_VERSION}"
          git push origin main

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          git tag "game-v${NEW_VERSION}"
          git push origin "game-v${NEW_VERSION}"

          gh release create "game-v${NEW_VERSION}" \
            --title "Eternum v${NEW_VERSION}" \
            --notes-file /tmp/release-notes.md \
            --latest
