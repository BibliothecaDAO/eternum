name: Deploy Workers

# Deploys the central-service Workers to Cloudflare. Staging, which the isolated box stack uses, deploys on every push to
# the native branches; production deploys only by dispatch, at the cutover. Each environment has its own D1 databases
# and secrets. The guardian Worker is deployed by the owner alone and is not listed here.
on:
  push:
    branches: [native-services, native-world-foundation]
    paths:
      - "apps/realms/**"
      - "apps/guardian/**"
      - "packages/identity/**"
      - "packages/notifications/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloudflare environment"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-workers-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.worker }} to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: apps/realms
            package: "@realms-world/realms"
            database: realms-identity
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace dependencies
        run: pnpm --filter "${{ matrix.package }}^..." run build

      # Migrations run before the code that needs them; the database is created on its environment's first deploy.
      - name: Prepare the database
        if: matrix.database
        working-directory: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          name="${{ matrix.database }}-$TARGET"
          if ! pnpm exec wrangler d1 list --json | jq -e --arg name "$name" 'any(.[]; .name == $name)' > /dev/null; then
            pnpm exec wrangler d1 create "$name"
          fi
          pnpm exec wrangler d1 migrations apply DB --env "$TARGET" --remote

      # Secrets come from the environment's GitHub secrets and are set before the code that reads them deploys.
      - name: Set identity secrets
        if: matrix.worker == 'apps/realms'
        working-directory: ${{ matrix.worker }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          IDENTITY_RPC_URL: ${{ secrets.CLIENT_IDENTITY_RPC_URL }}
        run: |
          set -euo pipefail
          for name in BETTER_AUTH_SECRET IDENTITY_RPC_URL; do
            [ -n "${!name}" ] || { echo "::error::$name is not set for the $TARGET environment"; exit 1; }
          done
          jq -n '{BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET, IDENTITY_RPC_URL: env.IDENTITY_RPC_URL}' |
            pnpm exec wrangler secret bulk --env "$TARGET"

      - name: Deploy
        working-directory: ${{ matrix.worker }}
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: pnpm exec wrangler deploy --env "$TARGET"

      # The deploy record names the Worker's route pattern and the version it deployed; the route must answer
      # /api/health from that version, not from the one it replaced.
      - name: Verify the deployed version answers
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          record=$(jq -c 'select(.type == "deploy")' "$WRANGLER_OUTPUT_FILE_PATH")
          target=$(jq -r '.targets[0]' <<< "$record")
          version=$(jq -r '.version_id' <<< "$record")
          host=${target#https://}
          host=${host%%/*}
          for attempt in $(seq 1 20); do
            if curl -fsS "https://$host/api/health" > health.json &&
              jq -e --arg env "$TARGET" --arg version "$version" \
                '.environment == $env and .version == $version' health.json > /dev/null; then
              cat health.json
              exit 0
            fi
            sleep 3
          done
          echo "::error::https://$host/api/health did not answer from version $version"
          cat health.json || true
          exit 1
