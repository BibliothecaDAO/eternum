name: docs

on:
  workflow_call:

jobs:
  # The docs site's own build, as deploy/first publishes it to docs.realms.party: its tests, every page, links and
  # images, and the balance check that holds each stated number to the config it comes from. Then the pages' typecheck.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      # Only the media the docs pages ship, found by tracing every file the job's steps open, stat or list. A step that
      # starts reading anything else fails with ENOENT; add its path here.
      - uses: ./.github/actions/checkout-without-media
        with:
          keep: |
            apps/game/public/docs-media
            apps/game/public/gifs
            apps/game/public/icons/facets
            apps/game/public/images/biomes
            apps/game/public/images/buildings/construction
            apps/game/public/images/covers
            apps/game/public/images/logos
            apps/game/public/images/ring_pass.png
            apps/game/public/screenshots
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the docs
        run: pnpm run build:docs
      # After the build, which builds the packages: the pages read their built declarations.
      - name: Typecheck the docs
        run: pnpm --dir apps/game-docs typecheck
