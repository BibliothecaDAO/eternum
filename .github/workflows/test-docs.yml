name: docs

on:
  workflow_call:

jobs:
  # The docs site's own build, as deploy/first publishes it to docs.realms.party: its tests, every page, links and
  # images, and the balance check that holds each stated number to the config it comes from. Then the pages' typecheck.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the docs
        run: pnpm run build:docs
      # After the build, which builds @bibliothecadao/types: the pages read its built declarations.
      - name: Typecheck the docs
        run: pnpm --dir apps/game-docs typecheck
