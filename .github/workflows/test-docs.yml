name: docs

on:
  workflow_call:

jobs:
  # The docs site's own build, as Vercel deploys it: its tests, every page, links and images, and the balance check
  # that holds each stated number to the config it comes from.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check Vercel runs the commands this job runs
        run: |
          test "$(jq -r .installCommand vercel.json)" = "pnpm install --frozen-lockfile"
          test "$(jq -r .buildCommand vercel.json)" = "pnpm run build:docs"
      # Vercel starts pnpm 9 for this lockfile on eternum-docs, so the install starts there too and must hand over to
      # the pnpm package.json names.
      - name: Install dependencies, started with pnpm 9 as on Vercel
        run: npx --yes pnpm@9 install --frozen-lockfile
      - name: Build the docs
        run: pnpm run build:docs
