name: Deploy Client

# Ships the game client to play.realms.party as a Cloudflare Pages project
# (project name in vars.CLOUDFLARE_PAGES_PROJECT; the custom domain is attached
# in the Pages dashboard once). Manual dispatch keeps deploys deliberate; the
# build reads the committed .env.production and stamps the version from the ref.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label shown in-app (defaults to the short SHA)"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-client
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build:packages

      - name: Build client
        env:
          VITE_PUBLIC_GAME_VERSION: ${{ github.event.inputs.version || github.sha }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.CLIENT_SENTRY_DSN }}
        run: pnpm --dir apps/game build

      # Live renderer smokes gate the deploy, not PRs: they exercise the exact
      # artifact about to ship against the real appchain (Herald + Katana), so
      # a broken boot never reaches players and PR CI stays hermetic.
      - name: Start game client preview server
        env:
          ETERNUM_DISABLE_MKCERT: "true"
        run: |
          pnpm --dir apps/game preview --host 127.0.0.1 --port 4173 > /tmp/eternum-game-preview.log 2>&1 &
          echo $! > /tmp/eternum-game-preview.pid

      - name: Wait for game client preview server
        env:
          GAME_CLIENT_PREVIEW_URL: "http://127.0.0.1:4173"
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$GAME_CLIENT_PREVIEW_URL" >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Game client preview server did not become ready" >&2
          cat /tmp/eternum-game-preview.log >&2 || true
          exit 1

      - name: Run renderer scene smoke
        env:
          GAME_CLIENT_PREVIEW_URL: "http://127.0.0.1:4173"
          HERALD_URL: "https://herald.realms.party"
        run: |
          node ./apps/game/scripts/run-renderer-scene-smoke.mjs \
            --base-url "$GAME_CLIENT_PREVIEW_URL" \
            --chain madara \
            --scenes map,hex \
            --artifact-dir /tmp/renderer-scene-smoke-artifacts

      - name: Upload renderer scene smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-scene-smoke-artifacts
          path: /tmp/renderer-scene-smoke-artifacts
          if-no-files-found: ignore

      - name: Run renderer debug smoke
        env:
          GAME_CLIENT_PREVIEW_URL: "http://127.0.0.1:4173"
        run: |
          node ./apps/game/scripts/run-renderer-debug-smoke.mjs \
            --base-url "$GAME_CLIENT_PREVIEW_URL" \
            --scenarios baseline,stress \
            --output /tmp/renderer-debug-smoke.json

      - name: Upload renderer debug smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-debug-smoke-result
          path: /tmp/renderer-debug-smoke.json

      - name: Stop game client preview server
        if: always()
        run: |
          if [ -f /tmp/eternum-game-preview.pid ]; then
            kill "$(cat /tmp/eternum-game-preview.pid)" || true
          fi

      - name: Write cache headers
        working-directory: apps/game
        run: |
          set -euo pipefail
          # Never ship sourcemaps publicly.
          find dist -name "*.js.map" -delete
          # Three cache tiers, as a Pages _headers file. Only Vite's content-hashed
          # assets/ may be immutable: a stable-path file cached immutable is
          # unfixable in a browser for a year (the corrupt /basis/ wasm proved it).
          # HTML + service-worker files revalidate every request — a stale sw.js is
          # the one file that can pin testers to an old build. Everything else
          # (public/ passthrough: models, basis, images, sounds) revalidates after
          # 5 minutes. Pages deploys are atomic and invalidate its cache, so no
          # purge step is needed.
          cat > dist/_headers <<'EOF'
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          /*.html
            Cache-Control: public, max-age=0, must-revalidate
          /sw.js
            Cache-Control: public, max-age=0, must-revalidate
          /registerSW.js
            Cache-Control: public, max-age=0, must-revalidate
          /manifest.webmanifest
            Cache-Control: public, max-age=0, must-revalidate
          /*
            Cache-Control: public, max-age=300, must-revalidate
          EOF

      # wrangler-action@v3 auto-installs wrangler with `pnpm add`, which pnpm refuses at a workspace root
      # (ERR_PNPM_ADDING_TO_ROOT). Run wrangler with `pnpm dlx` instead — isolated, no workspace mutation.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler@3 pages deploy apps/game/dist \
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" \
            --branch=main --commit-hash="${{ github.sha }}"
