name: Deploy Client

# Ships the game client as a Cloudflare Pages project per GitHub environment, by dispatch only: production is the
# live client, and it moves to the native client only as the cutover's switch step, never on a push to next. Each
# environment names its Pages project (vars.CLOUDFLARE_PAGES_PROJECT), the origin the client is served from
# (vars.CLIENT_ORIGIN, whose /api belongs to that environment's identity Worker) and its zone (vars.CLIENT_ZONE), and
# holds its identity RPC secret; the custom domain is attached in the Pages dashboard once. The build reads
# .env.production plus the identity RPC secret and stamps the version from the ref.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label shown in-app (defaults to the short SHA)"
        required: false
      environment:
        description: "GitHub environment to deploy"
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-client-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      VITE_PUBLIC_IDENTITY_RPC_URL: ${{ secrets.CLIENT_IDENTITY_RPC_URL }}
      CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
      CLIENT_ZONE: ${{ vars.CLIENT_ZONE }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Validate the environment's configuration
        run: |
          missing=()
          for name in VITE_PUBLIC_IDENTITY_RPC_URL CLIENT_ORIGIN CLIENT_ZONE PAGES_PROJECT; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::this environment has no ${missing[*]} (CLIENT_IDENTITY_RPC_URL secret; CLIENT_ORIGIN, CLIENT_ZONE, CLOUDFLARE_PAGES_PROJECT vars)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build:packages

      - name: Test deployment verification and chunk recovery
        run: |
          node --test apps/game/scripts/verify-client-deployment.test.mjs
          node --test apps/game/scripts/ensure-pwa-cache-rule.test.mjs
          node --test apps/game/scripts/verify-pwa-build.test.mjs
          pnpm --dir apps/game test src/utils/chunk-load-recovery.test.ts src/pwa
          pnpm --dir apps/game verify:assets

      - name: Build client
        env:
          VITE_PUBLIC_GAME_VERSION: ${{ github.event.inputs.version || github.sha }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.CLIENT_SENTRY_DSN }}
        run: pnpm --dir apps/game build

      - name: Verify emitted offline cache and install assets
        run: node apps/game/scripts/verify-pwa-build.mjs apps/game/dist pwa-build-check.json

      - name: Upload offline cache verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build-check
          path: pwa-build-check.json

      - name: Remove public sourcemaps
        working-directory: apps/game
        run: |
          set -euo pipefail
          # Never ship sourcemaps publicly.
          find dist -name "*.js.map" -delete

      - name: Enforce origin cache headers for PWA resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node apps/game/scripts/ensure-pwa-cache-rule.mjs "$CLIENT_ORIGIN" "$CLIENT_ZONE"

      # wrangler-action@v3 auto-installs wrangler with `pnpm add`, which pnpm refuses at a workspace root
      # (ERR_PNPM_ADDING_TO_ROOT). Run wrangler with `pnpm dlx` instead — isolated, no workspace mutation.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler@3 pages deploy apps/game/dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main --commit-hash="${{ github.sha }}"

      - name: Verify published client modules and routes
        run:
          node apps/game/scripts/verify-client-deployment.mjs apps/game/dist "$CLIENT_ORIGIN"
          client-deployment-check.json

      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-deployment-check
          path: client-deployment-check.json
