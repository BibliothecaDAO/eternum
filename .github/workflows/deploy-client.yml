name: Deploy Client
run-name: Deploy client to ${{ inputs.environment }} at ${{ github.sha }}

# Publishes the selected environment from a reviewed ref. Public deployment coordinates live in one table.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label shown in-app (defaults to the short SHA)"
        required: false
      environment:
        description: "GitHub environment to deploy"
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-client-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Production serves players, so it publishes only a commit whose landing validation run is green.
  validated:
    if: inputs.environment == 'production'
    uses: ./.github/workflows/landing-validated.yml
    permissions:
      actions: read
      contents: read

  deploy:
    needs: validated
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      VITE_PUBLIC_L2_RPC_URL: ${{ secrets.L2_RPC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve public deployment coordinates
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const targets = JSON.parse(readFileSync('deploy/first/environments.json', 'utf8'));
          const target = Object.values(targets).find(value => value.worker === process.env.TARGET);
          if (!target || !process.env.VITE_PUBLIC_L2_RPC_URL) throw new Error('Environment and L2_RPC_URL are required');
          for (const [name, value] of Object.entries({CLIENT_ORIGIN: target.origin, CLIENT_ZONE: target.zone, PAGES_PROJECT: target.pages}))
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          JS

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build:packages

      # The client deploy's own script tests run in the client job (test-client.yml) on every change to them.
      - name: Test chunk recovery, the offline cache and the shipped assets
        run: |
          pnpm --dir apps/game test src/utils/chunk-load-recovery.test.ts src/pwa
          pnpm --dir apps/game verify:assets

      - name: Build client
        env:
          VITE_PUBLIC_GAME_VERSION: ${{ github.event.inputs.version || github.sha }}
          # The app's one environment constant: production, or the dev environment's Dev mark, install icon and labs.
          VITE_PUBLIC_ENVIRONMENT: ${{ inputs.environment }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.CLIENT_SENTRY_DSN }}
        run: pnpm --dir apps/game build

      - name: Verify emitted offline cache and install assets
        run: node apps/game/scripts/verify-pwa-build.mjs apps/game/dist pwa-build-check.json

      - name: Upload offline cache verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build-check
          path: pwa-build-check.json

      - name: Remove public sourcemaps
        working-directory: apps/game
        run: |
          set -euo pipefail
          # Never ship sourcemaps publicly.
          find dist -name "*.js.map" -delete

      - name: Enforce origin cache headers for PWA resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node apps/game/scripts/ensure-pwa-cache-rule.mjs "$CLIENT_ORIGIN" "$CLIENT_ZONE"

      # wrangler-action@v3 auto-installs wrangler with `pnpm add`, which pnpm refuses at a workspace root
      # (ERR_PNPM_ADDING_TO_ROOT). Run wrangler with `pnpm dlx` instead — isolated, no workspace mutation.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler@3 pages deploy apps/game/dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main --commit-hash="${{ github.sha }}"

      - name: Verify published client modules and routes
        run:
          node apps/game/scripts/verify-client-deployment.mjs apps/game/dist "$CLIENT_ORIGIN"
          client-deployment-check.json

      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-deployment-check
          path: client-deployment-check.json
