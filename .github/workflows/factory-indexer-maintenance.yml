name: Factory Indexer Maintenance
run-name:
  Factory Indexer Maintenance / ${{ github.event.inputs.environment }} / ${{ github.event.inputs.operation_count || '0'
  }} ops

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment boundary for every operation in this batch"
        required: true
        type: choice
        options:
          - slot.blitz
          - slot.eternum
          - slottest.blitz
          - slottest.eternum
          - mainnet.blitz
          - mainnet.eternum
      operation_count:
        description: "Number of maintenance operations in this batch"
        required: false
        default: "0"
      operations_json:
        description: "JSON array of indexer maintenance operations"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  CI: "true"

concurrency:
  group: aws-runtime-${{ github.event.inputs.environment }}-maintenance
  cancel-in-progress: false

jobs:
  maintain-indexers:
    name: Reconcile Indexers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    env:
      FACTORY_RUN_STORE_BRANCH: factory-runs
      RUNTIME_PROVIDER: ${{ vars.RUNTIME_PROVIDER || 'slot' }}
      GITHUB_TOKEN: ${{ github.token }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_RUNTIME_CLUSTER: ${{ vars.AWS_RUNTIME_CLUSTER }}
      AWS_RUNTIME_DOMAIN: ${{ vars.AWS_RUNTIME_DOMAIN || 'runtime.realms.world' }}
      AWS_RUNTIME_ECR_REPOSITORY_URL: ${{ vars.AWS_RUNTIME_ECR_REPOSITORY_URL }}
      AWS_RUNTIME_ECR_IMAGE: ${{ vars.AWS_RUNTIME_ECR_IMAGE }}
      AWS_RUNTIME_TASK_EXECUTION_ROLE_ARN: ${{ vars.AWS_RUNTIME_TASK_EXECUTION_ROLE_ARN }}
      AWS_RUNTIME_TASK_ROLE_ARN: ${{ vars.AWS_RUNTIME_TASK_ROLE_ARN }}
      AWS_RUNTIME_SUBNET_IDS: ${{ vars.AWS_RUNTIME_SUBNET_IDS }}
      AWS_RUNTIME_SECURITY_GROUP_IDS: ${{ vars.AWS_RUNTIME_SECURITY_GROUP_IDS }}
      AWS_RUNTIME_EFS_FILE_SYSTEM_ID: ${{ vars.AWS_RUNTIME_EFS_FILE_SYSTEM_ID }}
      AWS_RUNTIME_VPC_ID: ${{ vars.AWS_RUNTIME_VPC_ID }}
      AWS_RUNTIME_ALB_LISTENER_ARN: ${{ vars.AWS_RUNTIME_ALB_LISTENER_ARN }}
      AWS_RUNTIME_ALB_LISTENER_ARNS: ${{ vars.AWS_RUNTIME_ALB_LISTENER_ARNS }}
      AWS_RUNTIME_LOG_GROUP: ${{ vars.AWS_RUNTIME_LOG_GROUP || '/ecs/eternum-game-runtime' }}
      AWS_RUNTIME_SNS_TOPIC_ARN: ${{ vars.AWS_RUNTIME_SNS_TOPIC_ARN }}
      AWS_RUNTIME_CONTROL_TABLE_NAME: ${{ vars.AWS_RUNTIME_CONTROL_TABLE_NAME }}
      AWS_RUNTIME_REQUIRE_CONTROL_TABLE: ${{ vars.AWS_RUNTIME_REQUIRE_CONTROL_TABLE || 'true' }}
      AWS_RUNTIME_CORS_ORIGINS: ${{ vars.AWS_RUNTIME_CORS_ORIGINS }}
      SELECTED_ENVIRONMENT: ${{ github.event.inputs.environment }}
      OPERATIONS_JSON: ${{ github.event.inputs.operations_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_MAINTENANCE_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup ECS Exec client
        uses: ./.github/actions/setup-session-manager-plugin

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply indexer maintenance
        run: |
          set -euo pipefail
          operations_file="${RUNNER_TEMP}/indexer-maintenance-operations.json"
          printf '%s' "${OPERATIONS_JSON}" > "${operations_file}"
          bun config/deployer/clean/cli/indexer-maintenance.ts \
            --operations-file "${operations_file}" \
            --expected-environment "${SELECTED_ENVIRONMENT}" \
            | tee indexer-maintenance-result.json

      - name: Reconcile deleted runtime registry aliases
        if: ${{ always() && vars.RUNTIME_REGISTRY_URL != '' }}
        env:
          FACTORY_WORKER_ADMIN_SECRET: ${{ secrets.FACTORY_WORKER_ADMIN_SECRET }}
          RUNTIME_REGISTRY_URL: ${{ vars.RUNTIME_REGISTRY_URL }}
        run: |
          set -euo pipefail
          if [ ! -s indexer-maintenance-result.json ]; then
            exit 0
          fi
          bun scripts/update-runtime-registry.ts \
            --registry-url "${RUNTIME_REGISTRY_URL}" \
            --maintenance-result-file indexer-maintenance-result.json \
            | tee runtime-registry-result.json

      - name: Upload maintenance result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-indexer-maintenance-result
          path: |
            indexer-maintenance-result.json
            runtime-registry-result.json
          if-no-files-found: ignore
          retention-days: 35
