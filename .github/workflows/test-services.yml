name: services

on:
  workflow_call:

jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build identity and notification contracts
        run: |
          pnpm run build:packages
      - name: Verify policy against the generated event inventory
        run: pnpm --dir packages/notifications test
      - name: Verify authenticated preference transport
        run: pnpm --dir packages/identity test
      - name: Test the identity Worker on D1
        run: pnpm --dir apps/realms test
      - name: Test the launch Worker on D1
        run: pnpm --dir apps/launch-service test
      - name: Test value relay and independent payout checks
        run: pnpm --dir apps/value-relay test
      - name: Test shared ledger readers
        run: pnpm --dir packages/value-ledger test
      - name: Test independent status publication
        run: pnpm --dir apps/status-monitor test
      - name: Typecheck services
        run: |
          pnpm --dir apps/realms typecheck
          pnpm --dir apps/guardian typecheck
          pnpm --dir apps/launch-service typecheck
          pnpm --dir apps/status-monitor typecheck
          pnpm --dir apps/value-relay typecheck
          pnpm --dir packages/value-ledger typecheck
