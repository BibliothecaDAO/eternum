name: AWS Runtime E2E
run-name:
  AWS Runtime E2E / ${{ github.event.inputs.environment || vars.AWS_RUNTIME_E2E_ENVIRONMENT || 'slottest.blitz' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: false
        default: slottest.blitz
        type: choice
        options:
          - slot.blitz
          - slot.eternum
          - slottest.blitz
          - slottest.eternum
      runtime_name:
        description: "Runtime name prefix"
        required: false
        default: e2e-nightly
        type: string
      domain:
        description: "Runtime domain"
        required: false
        default: runtime.realms.world
        type: string
      image_digest:
        description: "Approved immutable runtime image digest"
        required: true
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-runtime-${{ github.event.inputs.environment || vars.AWS_RUNTIME_E2E_ENVIRONMENT || 'slottest.blitz' }}-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Runtime e2e (${{ matrix.runtime_kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event.inputs.environment || vars.AWS_RUNTIME_E2E_ENVIRONMENT || 'slottest.blitz' }}
    strategy:
      fail-fast: false
      matrix:
        runtime_kind:
          - katana
          - torii
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_RUNTIME_E2E_ENVIRONMENT:
        ${{ github.event.inputs.environment || vars.AWS_RUNTIME_E2E_ENVIRONMENT || 'slottest.blitz' }}
      AWS_RUNTIME_E2E_RUNTIME_KIND: ${{ matrix.runtime_kind }}
      AWS_RUNTIME_E2E_DOMAIN:
        ${{ github.event.inputs.domain || vars.AWS_RUNTIME_E2E_DOMAIN || vars.AWS_RUNTIME_DOMAIN ||
        'runtime.realms.world' }}
      AWS_RUNTIME_E2E_TIER: ${{ vars.AWS_RUNTIME_E2E_TIER || 'basic' }}
      AWS_RUNTIME_E2E_RESIZE_TIER: ${{ vars.AWS_RUNTIME_E2E_RESIZE_TIER || 'pro' }}
      AWS_RUNTIME_E2E_IMAGE_DIGEST: ${{ github.event.inputs.image_digest || vars.AWS_RUNTIME_IMAGE_DIGEST }}
      AWS_RUNTIME_E2E_RPC_URL: ${{ vars.AWS_RUNTIME_E2E_RPC_URL }}
      AWS_RUNTIME_E2E_WORLD_ADDRESS: ${{ vars.AWS_RUNTIME_E2E_WORLD_ADDRESS }}
      AWS_RUNTIME_CLUSTER: ${{ vars.AWS_RUNTIME_CLUSTER }}
      AWS_RUNTIME_DOMAIN: ${{ vars.AWS_RUNTIME_DOMAIN || 'runtime.realms.world' }}
      AWS_RUNTIME_ECR_REPOSITORY_URL: ${{ vars.AWS_RUNTIME_ECR_REPOSITORY_URL }}
      AWS_RUNTIME_ECR_IMAGE: ${{ vars.AWS_RUNTIME_ECR_IMAGE }}
      AWS_RUNTIME_TASK_EXECUTION_ROLE_ARN: ${{ vars.AWS_RUNTIME_TASK_EXECUTION_ROLE_ARN }}
      AWS_RUNTIME_TASK_ROLE_ARN: ${{ vars.AWS_RUNTIME_TASK_ROLE_ARN }}
      AWS_RUNTIME_SUBNET_IDS: ${{ vars.AWS_RUNTIME_SUBNET_IDS }}
      AWS_RUNTIME_SECURITY_GROUP_IDS: ${{ vars.AWS_RUNTIME_SECURITY_GROUP_IDS }}
      AWS_RUNTIME_EFS_FILE_SYSTEM_ID: ${{ vars.AWS_RUNTIME_EFS_FILE_SYSTEM_ID }}
      AWS_RUNTIME_VPC_ID: ${{ vars.AWS_RUNTIME_VPC_ID }}
      AWS_RUNTIME_ALB_LISTENER_ARN: ${{ vars.AWS_RUNTIME_ALB_LISTENER_ARN }}
      AWS_RUNTIME_ALB_LISTENER_ARNS: ${{ vars.AWS_RUNTIME_ALB_LISTENER_ARNS }}
      AWS_RUNTIME_LOG_GROUP: ${{ vars.AWS_RUNTIME_LOG_GROUP || '/ecs/eternum-game-runtime' }}
      AWS_RUNTIME_SNS_TOPIC_ARN: ${{ vars.AWS_RUNTIME_SNS_TOPIC_ARN }}
      AWS_RUNTIME_HEALTH_START_PERIOD_SECONDS: ${{ vars.AWS_RUNTIME_HEALTH_START_PERIOD_SECONDS }}
      AWS_RUNTIME_CONTROL_TABLE_NAME: ${{ vars.AWS_RUNTIME_CONTROL_TABLE_NAME }}
      AWS_RUNTIME_REQUIRE_CONTROL_TABLE: ${{ vars.AWS_RUNTIME_REQUIRE_CONTROL_TABLE || 'true' }}
      AWS_RUNTIME_CORS_ORIGINS: ${{ vars.AWS_RUNTIME_CORS_ORIGINS }}
      INPUT_RUNTIME_NAME: ${{ github.event.inputs.runtime_name || 'e2e-nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_E2E_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup ECS Exec client
        uses: ./.github/actions/setup-session-manager-plugin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run runtime e2e
        run: |
          set -euo pipefail
          export AWS_RUNTIME_E2E_RUNTIME_NAME="${INPUT_RUNTIME_NAME}-${AWS_RUNTIME_E2E_RUNTIME_KIND}"
          AWS_RUNTIME_E2E_RUNTIME_INSTANCE_ID="$(
            bun config/deployer/clean/cli/runtime-instance-id.ts \
              --seed-part github-run \
              --seed-part "${GITHUB_REPOSITORY}" \
              --seed-part "${GITHUB_WORKFLOW_REF}" \
              --seed-part "${GITHUB_RUN_ID}" \
              --seed-part "${AWS_RUNTIME_E2E_ENVIRONMENT}" \
              --seed-part "${AWS_RUNTIME_E2E_RUNTIME_KIND}" \
              --seed-part "${AWS_RUNTIME_E2E_RUNTIME_NAME}"
          )"
          export AWS_RUNTIME_E2E_RUNTIME_INSTANCE_ID
          make aws-runtime-e2e | tee aws-runtime-e2e-result.json

      - name: Upload e2e result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aws-runtime-e2e-result-${{ matrix.runtime_kind }}
          path: aws-runtime-e2e-result.json
