name: test factory contracts

on:
  pull_request:
    paths:
      - "contracts/l3/factory/**"

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.88.0

jobs:
  factory-cairo-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.13.1"
      - run: cd contracts/l3/factory && scarb fmt --check

  factory-cairo-test:
    needs: factory-cairo-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/setup-snfoundry@v3
        with:
          # Must match snforge_std in contracts/l3/factory/Scarb.toml (and
          # .tool-versions); unpinned, this installs latest and a binary/std
          # mismatch fails cheatcode-based tests.
          starknet-foundry-version: "0.51.2"
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.13.1"
      - uses: actions/checkout@v3
      - run: |
          cd contracts/l3/factory && snforge test

  factory-cairo-build:
    needs: factory-cairo-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.13.1"
      - uses: actions/checkout@v3
      - run: |
          cd contracts/l3/factory && scarb build
