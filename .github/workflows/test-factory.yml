name: test factory contracts

on:
  pull_request:
    paths:
      - "contracts/factory/**"

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.88.0

jobs:
  factory-cairo-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.13.1"
      - run: cd contracts/factory && scarb fmt --check

  factory-cairo-test:
    needs: factory-cairo-fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@v3
        with:
          tool-versions: .tool-versions
      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.13.1"
      - name: Test factory contracts
        run: |
          cd contracts/factory && snforge test

  factory-cairo-build:
    needs: factory-cairo-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.13.1"
      - uses: actions/checkout@v3
      - run: |
          cd contracts/factory && scarb build
