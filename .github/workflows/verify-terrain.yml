name: Verify procedural terrain

on:
  workflow_call:

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Verify shipped assets and verification scripts
        run: pnpm --dir apps/game verify:assets

      - name: Start auth-free terrain host
        env:
          VITE_PUBLIC_SHARD_URL: http://127.0.0.1:1
          VITE_PUBLIC_IDENTITY_RPC_URL: http://127.0.0.1:1
        run: |
          pnpm --dir apps/game dev --host 127.0.0.1 --port 4173 > terrain-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/lab && exit 0
            sleep 1
          done
          cat terrain-vite.log
          exit 1

      - name: Verify both renderer backends
        run: >-
          pnpm --dir apps/game verify:terrain:gallery --base-url http://127.0.0.1:4173 --artifact-dir terrain-artifacts
          --timing-policy informational

      - name: Build backend contact sheet
        run: >-
          pnpm --dir apps/game verify:terrain:contact-sheet --input-dir terrain-artifacts --output
          terrain-artifacts/backend-contact-sheet.png

      - name: Upload terrain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-terrain-verification
          path: |
            apps/game/terrain-artifacts
            terrain-vite.log
