name: Verify procedural terrain

on:
  pull_request:
    paths:
      - "apps/game/src/three/terrain/**"
      - "apps/game/src/three/scenes/worldmap.tsx"
      - "apps/game/src/three/scenes/worldmap-*.ts"
      - "apps/game/src/three/renderer-frame-runtime*.ts"
      - "apps/game/scripts/terrain-*/**"
      - "apps/game/scripts/*worldmap-terrain*.mjs"
      - "apps/game/public/models/procedural-terrain/**"
      - "apps/game/public/textures/procedural-terrain/**"
      - "packages/core/src/utils/biome/**"
      - "apps/game/vitest.assets.*"
      - ".github/workflows/verify-terrain.yml"

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Verify terrain contracts
        run: pnpm --dir apps/game test src/three/terrain

      - name: Verify shipped assets and verification scripts
        run: pnpm --dir apps/game verify:assets

      - name: Verify worldmap presentation and authoritative update integration
        run: >-
          pnpm --dir apps/game test src/three/scenes/worldmap src/three/renderer-frame-runtime.test.ts
          src/three/frame-budget-work-queue.test.ts src/three/utils/chunk-geometry.test.ts src/three/perf/worldmap

      - name: Start auth-free terrain host
        env:
          VITE_PUBLIC_PLAYER_ACCOUNT_CLASS_HASH: "0x1"
          VITE_PUBLIC_PLAYER_REGISTRY_ADDRESS: "0x2"
          VITE_PUBLIC_BINDING_AUTHORITY_ADDRESS: "0x3"
          VITE_PUBLIC_FEE_TOKEN_ADDRESS: "0x4"
          VITE_PUBLIC_HERALD_URL: http://127.0.0.1:1
          VITE_PUBLIC_ADMISSION_URL: http://127.0.0.1:1
          VITE_PUBLIC_IDENTITY_ORIGIN: http://127.0.0.1:1
          VITE_PUBLIC_IDENTITY_RPC_URL: http://127.0.0.1:1
        run: |
          export NATIVE_WORLD_MANIFEST="$RUNNER_TEMP/terrain-native-manifest.json"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const schema = JSON.parse(readFileSync("contracts/l3/world-native/schema/schema.json", "utf8"));
          const domains = Object.fromEntries(Object.keys(schema.domains).map((name, index) => [
            name, { address: `0x${(index + 1).toString(16)}`, initialClassHash: "0x1", classes: { "0x1": schema.identity } },
          ]));
          writeFileSync(process.env.NATIVE_WORLD_MANIFEST, JSON.stringify({
            world: { address: domains.season.address, abi: [] },
            contracts: [], models: [], events: [],
            native: { version: 1, deploymentBlock: 0, activeSchema: schema.identity, schemas: { [schema.identity]: schema }, domains },
          }));
          JS
          pnpm --dir apps/game dev --host 127.0.0.1 --port 4173 > terrain-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/lab && exit 0
            sleep 1
          done
          cat terrain-vite.log
          exit 1

      - name: Verify both renderer backends
        run: >-
          pnpm --dir apps/game verify:terrain:gallery --base-url http://127.0.0.1:4173 --artifact-dir terrain-artifacts
          --timing-policy informational

      - name: Build backend contact sheet
        run: >-
          pnpm --dir apps/game verify:terrain:contact-sheet --input-dir terrain-artifacts --output
          terrain-artifacts/backend-contact-sheet.png

      - name: Upload terrain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-terrain-verification
          path: |
            apps/game/terrain-artifacts
            terrain-vite.log
