name: Verify procedural terrain

on:
  workflow_call:

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      # Only the media the asset checks and the terrain gallery read, found by tracing every file the job's steps open,
      # stat or list. A step that starts reading anything else fails with ENOENT; add its path here.
      - uses: ./.github/actions/checkout-without-media
        with:
          keep: |
            apps/game/asset-sources/frontier-beasts/refined
            apps/game/asset-sources/frontier-painted
            apps/game/asset-sources/lab/frontier-beasts
            apps/game/asset-sources/realms/devcon
            apps/game/asset-sources/workshops
            apps/game/public/images/buildings/construction
            apps/game/public/images/icons
            apps/game/public/images/logos
            apps/game/public/models/biome-creatures
            apps/game/public/models/characters/t1-knight-default
            apps/game/public/models/ethereal
            apps/game/public/models/frontier
            apps/game/public/models/new-buildings-opt
            apps/game/public/models/outposts
            apps/game/public/models/procedural-terrain
            apps/game/public/models/realms
            apps/game/public/models/reward-tiles
            apps/game/public/models/ships
            apps/game/public/models/units
            apps/game/public/textures/realms
            apps/game/scripts/client-playtest/fixtures

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Verify shipped assets and verification scripts
        run: pnpm --dir apps/game verify:assets

      - name: Start auth-free terrain host
        env:
          # A placeholder the dev server requires to start, shaped as the guard demands (Alchemy for mainnet, a dev
          # build's L2); the terrain lab never signs in or reads the L2, so nothing calls the RPC and no key is needed.
          VITE_PUBLIC_L2_RPC_URL: https://starknet-mainnet.g.alchemy.com/starknet/version/rpc/v0_9/terrain-check
        run: |
          pnpm --dir apps/game dev --host 127.0.0.1 --port 4173 > terrain-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/lab && exit 0
            sleep 1
          done
          cat terrain-vite.log
          exit 1

      - name: Diagnose WebGPU capture (temporary)
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          echo "== preset, headed"
          npx -y agent-browser@0.42.0 doctor --webgpu --headed --json || true
          echo "== preset, headed, session GPU flags"
          npx -y agent-browser@0.42.0 doctor --webgpu --headed --json --args "--ignore-gpu-blocklist,--enable-gpu,--use-angle=vulkan,--enable-features=Vulkan,--enable-unsafe-webgpu,--enable-unsafe-swiftshader" || true
          echo "== preset, headless"
          npx -y agent-browser@0.42.0 doctor --webgpu --json || true

      - name: Verify both renderer backends
        env:
          # Headless Chrome on Linux never puts a WebGPU canvas into a screenshot, so the browser runs headed on the Xvfb
          # display agent-browser starts. The runner has no GPU: the WebGPU preset draws through SwiftShader's Vulkan.
          AGENT_BROWSER_HEADED: "1"
          AGENT_BROWSER_WEBGPU: "1"
        run: >-
          pnpm --dir apps/game verify:terrain:gallery --base-url http://127.0.0.1:4173 --artifact-dir terrain-artifacts
          --timing-policy informational

      - name: Build backend contact sheet
        run: >-
          pnpm --dir apps/game verify:terrain:contact-sheet --input-dir terrain-artifacts --output
          terrain-artifacts/backend-contact-sheet.png

      - name: Upload terrain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-terrain-verification
          path: |
            apps/game/terrain-artifacts
            terrain-vite.log
