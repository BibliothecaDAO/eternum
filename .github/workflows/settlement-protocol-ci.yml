name: Settlement protocol CI

on:
  pull_request:
    paths:
      - "contracts/settlement_protocol/**"
      - "contracts/settlement_appchain/**"
      - "contracts/game/src/**"
      - "contracts/factory/src/**"
      - "contracts/*/src/**"
      - "contracts/*/scripts/**"
      - "contracts/*/ext/**"
      - "contracts/*/Scarb.toml"
      - "contracts/*/Scarb.lock"
      - "contracts/*/.tool-versions"
      - "config/deployer/clean/**"
      - "packages/settlement-codec/**"
      - "proofs/eternum-settlement/**"
      - "scripts/settlement/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/settlement-protocol-ci.yml"

permissions:
  contents: read

concurrency:
  group: settlement-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-vectors:
    name: Cross-language schema and vectors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Setup Scarb for the A18 genesis class artifact
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
        with:
          scarb-version: "2.13.1"

      - name: Build the A18 deterministic shell artifact
        working-directory: contracts/settlement_protocol
        run: scarb build

      - name: Install the pinned Katana genesis reproducer
        run: |
          provenance="packages/settlement-codec/schema/katana-release-provenance-a18-v1.json"
          archive_url="$(node -p "require('./${provenance}').linuxAmd64.url")"
          archive_sha256="$(node -p "require('./${provenance}').linuxAmd64.sha256")"
          source_commit="$(node -p "require('./${provenance}').sourceCommit")"
          expected_version="$(node -p "require('./${provenance}').binaryVersion")"
          archive="${RUNNER_TEMP}/katana_v1.7.1_linux_amd64.tar.gz"
          test "${source_commit}" = "7882660a91e776ccacdc0e2e3fe2469f6b4df096"
          test "${archive_url}" = "https://github.com/dojoengine/katana/releases/download/v1.7.1/katana_v1.7.1_linux_amd64.tar.gz"
          test "${archive_sha256}" = "34632a9640b4572fb46a227deb645334addf1ca88431613da47ea8e7c70992e1"
          test "${expected_version}" = "katana 1.7.1 (7882660)"
          curl --fail --location --silent --show-error \
            "${archive_url}" \
            --output "${archive}"
          echo "${archive_sha256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" katana
          sudo install "${RUNNER_TEMP}/katana" /usr/local/bin/katana
          test "$(katana --version | head -n 1)" = "${expected_version}"

      - name: Reject stale or undeclared schemas
        run: |
          pnpm run check:settlement-schema
          pnpm run check:settlement-trees
          pnpm run check:economic-write-inventory
          pnpm run check:config-setter-inventory
          pnpm run check:generated-config
          pnpm run check:authority-inventory
          pnpm run check:economic-interface-schema
          pnpm run check:package-lock-matrix
          pnpm run check:deployment-identity-vector

      - name: Test TypeScript codecs
        run: pnpm --dir packages/settlement-codec test

      - name: Verify finalized authority evidence and local class provenance
        run: |
          pnpm run verify:authority-observation
          pnpm run verify:authority-source-rebuild

      - name: Test independent deployment identity compiler
        run: pnpm vitest run config/deployer/clean/tests/settlement-deployment-identity.test.ts

      - name: Build TypeScript codecs
        run: pnpm --dir packages/settlement-codec build

      - name: Check and test Rust codecs
        working-directory: proofs/eternum-settlement
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  aligned-cairo-packages:
    name: Verify ${{ matrix.package }} on the frozen lane
    needs: protocol-vectors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          - collectibles
          - collectibles_claim
          - factory
          - game
          - lords
          - mmr
          - season_pass
          - settlement_appchain
          - settlement_integration_tests
          - settlement_protocol
          - village_pass
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
        with:
          scarb-version: "2.13.1"

      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@v3
        with:
          tool-versions: .tool-versions

      - name: Format, build, and test package
        working-directory: contracts/${{ matrix.package }}
        run: |
          set -o pipefail
          test_log="${RUNNER_TEMP}/${{ matrix.package }}-snforge.log"
          scarb fmt --check
          scarb build
          snforge test | tee "${test_log}"
          grep -Eq 'Collected [1-9][0-9]* test' "${test_log}"

      - name: Enforce A17 maximum-bound transaction headroom
        if: matrix.package == 'settlement_appchain'
        working-directory: contracts/settlement_appchain
        run: scarb run benchmark-a17
