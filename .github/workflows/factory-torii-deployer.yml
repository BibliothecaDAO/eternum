name: Factory Torii Deployer
run-name: >-
  Factory Torii Deployer / ${{ inputs.env || github.event.inputs.env || 'slot' }} / ${{ inputs.torii_prefix ||
  github.event.inputs.torii_prefix || inputs.torii_name || github.event.inputs.torii_name || 'torii' }} / ${{
  inputs.launch_request_id || github.event.inputs.launch_request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Whether to deploy a Torii runtime or resize an existing runtime"
        required: false
        default: "deploy"
        type: choice
        options:
          - deploy
          - update-tier
      env:
        description: "Legacy environment label used by older callers"
        required: false
        default: "slot"
      environment_id:
        description: "Clean deployer environment id"
        required: false
        default: ""
      runtime_provider:
        description: "Runtime provider; AWS is the v1 replacement path"
        required: false
        default: "aws"
      runtime_domain:
        description: "Public runtime domain"
        required: false
        default: "runtime.realms.world"
      torii_prefix:
        description: "Torii runtime name prefix"
        required: false
        default: "eternum-torii"
      torii_name:
        description: "Existing or explicit Torii runtime name"
        required: false
        default: ""
      torii_version:
        description: "Dojo/Torii image version metadata"
        required: false
        default: "v1.8.16"
      slot_team:
        description: "Deprecated Slot team input retained for caller compatibility"
        required: false
        default: "realms-eternum"
      torii_tier:
        description: "Fixed AWS runtime tier"
        required: false
        default: "basic"
        type: choice
        options:
          - basic
          - pro
          - epic
          - legendary
      rpc_url:
        description: "Starknet RPC URL used by Torii"
        required: false
      torii_world_address:
        description: "Torii world address"
        required: false
      world_block:
        description: "Deprecated Slot config input retained for caller compatibility"
        required: false
        default: "0"
      torii_namespaces:
        description: "Comma-separated namespaces"
        required: false
        default: "s1_eternum"
      torii_external_contracts:
        description: "External contracts to index"
        required: false
        default: ""
      torii_replicas:
        description: "Deprecated Slot replica input retained for caller compatibility"
        required: false
        default: "1"
      launch_request_id:
        description: "Internal launch correlation id"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  CI: "true"

jobs:
  deploy-torii:
    name: Reconcile AWS Torii
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      ${{ github.event.inputs.environment_id || (github.event.inputs.env == 'mainnet' && 'mainnet.blitz' ||
      'slot.blitz') }}
    env:
      FACTORY_RUNTIME_PROVIDER: aws
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_RUNTIME_CLUSTER: ${{ vars.AWS_RUNTIME_CLUSTER }}
      AWS_RUNTIME_DOMAIN: ${{ github.event.inputs.runtime_domain || vars.AWS_RUNTIME_DOMAIN || 'runtime.realms.world' }}
      AWS_RUNTIME_ECR_IMAGE: ${{ vars.AWS_RUNTIME_ECR_IMAGE }}
      AWS_RUNTIME_ECR_IMAGE_DIGEST: ${{ vars.AWS_RUNTIME_ECR_IMAGE_DIGEST }}
      AWS_RUNTIME_TASK_EXECUTION_ROLE_ARN: ${{ vars.AWS_RUNTIME_TASK_EXECUTION_ROLE_ARN }}
      AWS_RUNTIME_TASK_ROLE_ARN: ${{ vars.AWS_RUNTIME_TASK_ROLE_ARN }}
      AWS_RUNTIME_SUBNET_IDS: ${{ vars.AWS_RUNTIME_SUBNET_IDS }}
      AWS_RUNTIME_SECURITY_GROUP_IDS: ${{ vars.AWS_RUNTIME_SECURITY_GROUP_IDS }}
      AWS_RUNTIME_EFS_FILE_SYSTEM_ID: ${{ vars.AWS_RUNTIME_EFS_FILE_SYSTEM_ID }}
      AWS_RUNTIME_VPC_ID: ${{ vars.AWS_RUNTIME_VPC_ID }}
      AWS_RUNTIME_ALB_LISTENER_ARN: ${{ vars.AWS_RUNTIME_ALB_LISTENER_ARN }}
      AWS_RUNTIME_LOG_GROUP: ${{ vars.AWS_RUNTIME_LOG_GROUP || '/ecs/eternum-game-runtime' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Configure AWS credentials
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reconcile Torii runtime
        run: |
          set -euo pipefail

          provider="${{ github.event.inputs.runtime_provider || 'aws' }}"
          if [ "${provider}" != "aws" ]; then
            echo "factory-torii-deployer now provisions AWS runtimes only. Requested provider: ${provider}" >&2
            exit 1
          fi

          operation="${{ github.event.inputs.operation || 'deploy' }}"
          runtime_operation="deploy"
          if [ "${operation}" = "update-tier" ]; then
            runtime_operation="resize"
          fi

          environment_id="${{ github.event.inputs.environment_id }}"
          if [ -z "${environment_id}" ]; then
            case "${{ github.event.inputs.env || 'slot' }}" in
              slot) environment_id="slot.blitz" ;;
              mainnet) environment_id="mainnet.blitz" ;;
              *) environment_id="${{ github.event.inputs.env || 'slot.blitz' }}" ;;
            esac
          fi

          runtime_name="${{ github.event.inputs.torii_name }}"
          if [ -z "${runtime_name}" ]; then
            runtime_name="${{ github.event.inputs.torii_prefix }}"
          fi

          args=(
            --operation "${runtime_operation}"
            --environment "${environment_id}"
            --runtime-kind torii
            --runtime-name "${runtime_name}"
            --tier "${{ github.event.inputs.torii_tier || 'basic' }}"
            --version "${{ github.event.inputs.torii_version || 'v1.8.16' }}"
          )

          if [ -n "${{ github.event.inputs.rpc_url }}" ]; then
            args+=(--rpc-url "${{ github.event.inputs.rpc_url }}")
          fi

          if [ -n "${{ github.event.inputs.torii_world_address }}" ]; then
            args+=(--world-address "${{ github.event.inputs.torii_world_address }}")
          fi

          if [ -n "${{ github.event.inputs.torii_namespaces }}" ]; then
            args+=(--namespaces "${{ github.event.inputs.torii_namespaces }}")
          fi

          if [ -n "${{ github.event.inputs.torii_external_contracts }}" ]; then
            args+=(--external-contracts "${{ github.event.inputs.torii_external_contracts }}")
          fi

          bun config/deployer/clean/cli/aws-runtime.ts "${args[@]}" | tee aws-runtime-result.json

      - name: Upload runtime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-torii-runtime-result
          path: aws-runtime-result.json
