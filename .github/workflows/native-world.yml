name: native-world

on:
  pull_request:
  push:
    branches: [next]
    paths:
      - "contracts/l3/world-native/**"
      - "contracts/l3/randomness-protocol/**"
      - "apps/herald/src/model-registry.ts"
      - "config/deployer/clean/**"
      - "config/source/**"
      - "deploy/madara-lab/scripts/validate-native-target*"
      - "deploy/madara-lab/scripts/deploy-box*"
      - "deploy/madara-rand/native-intent*.ts"
      - "scripts/generate-realm-metadata.py"
      - "packages/**"
      - ".github/workflows/native-world.yml"
      - "pnpm-lock.yaml"

concurrency:
  group: native-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-world:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          tool-versions: contracts/l3/world-native/.tool-versions
          scarb-lock: contracts/l3/world-native/Scarb.lock
      - uses: foundry-rs/setup-snfoundry@v3
        with:
          tool-versions: contracts/l3/world-native/.tool-versions
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Install schema dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared model registry dependencies
        run: pnpm --filter @bibliothecadao/eternum... run build
      - name: Check native formatting
        working-directory: contracts/l3/world-native
        run: scarb fmt --check
      - name: Build native contracts
        working-directory: contracts/l3/world-native
        run: scarb build
      - name: Enforce class size headroom
        run: |
          node --test contracts/l3/world-native/scripts/check-class-sizes.test.mjs
          node contracts/l3/world-native/scripts/check-class-sizes.mjs > "$RUNNER_TEMP/native-class-sizes.json"
      - name: Upload class size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-class-sizes
          path: ${{ runner.temp }}/native-class-sizes.json
          if-no-files-found: error
      - name: Check recorded entrypoint ABI
        run: |
          (cd contracts/l3/randomness-protocol && scarb build)
          python3 contracts/l3/randomness-protocol/check-entrypoint.py \
            contracts/l3/world-native/target/dev/world_native_SeasonDomain.contract_class.json \
            "$RUNNER_TEMP/recorded-entrypoint.json"
      - name: Test all native rules and recorded execution
        working-directory: contracts/l3/world-native
        run: |
          set -euo pipefail
          for partition in {1..8}; do
            /usr/bin/time -v snforge test --max-threads 1 --partition "$partition/8"
          done
      - name: Reject schema drift
        run: bun contracts/l3/world-native/scripts/generate-schema.mjs --check

  randomness-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          tool-versions: contracts/l3/world-native/.tool-versions
          scarb-lock: contracts/l3/randomness-protocol/Scarb.lock
      - uses: foundry-rs/setup-snfoundry@v3
        with:
          tool-versions: contracts/l3/world-native/.tool-versions
      - name: Build and test recorded execution protocol
        working-directory: contracts/l3/randomness-protocol
        run: |
          scarb fmt --check
          scarb build
          /usr/bin/time -v snforge test --max-threads 1

  native-deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm run build:packages
      - name: Test native deployment and registrar
        run: |
          for file in config/deployer/clean/world/native/*.test.ts config/deployer/clean/tests/*.test.ts; do
            bun test "$file"
          done
      - name: Test retained receipt recovery
        run: bun test deploy/madara-rand/native-intent.test.ts
      - name: Test fail-closed deployment paths
        run: |
          node --test deploy/madara-lab/scripts/validate-native-target.test.mjs
          python3 -m unittest discover -s deploy/madara-lab/scripts -p test_deploy_box.py -v

  native-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build provider dependencies
        run: pnpm --filter @bibliothecadao/provider... run build
      - name: Test native command provider
        run: pnpm --dir packages/provider exec vitest run

  native-validation:
    if: always()
    needs: [native-world, randomness-protocol, native-deployer, native-provider]
    runs-on: ubuntu-latest
    steps:
      - name: Require every native validation job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = Object.entries(JSON.parse(process.env.JOB_RESULTS)).map(([name, job]) => ({ name, result: job.result }));
          console.log(JSON.stringify({ jobs, passed: jobs.every(({ result }) => result === "success") }));
          if (jobs.some(({ result }) => result !== "success")) process.exit(1);
          JS
