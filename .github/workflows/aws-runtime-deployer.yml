name: AWS Runtime Deployer
run-name: >-
  AWS Runtime / ${{ inputs.operation || github.event.inputs.operation || 'deploy' }} / ${{ inputs.environment ||
  github.event.inputs.environment || 'unknown' }} / ${{ inputs.runtime_name || github.event.inputs.runtime_name ||
  'runtime' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Runtime operation"
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - inspect
          - resize
          - delete
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - slot.blitz
          - slot.eternum
          - slottest.blitz
          - slottest.eternum
          - mainnet.blitz
          - mainnet.eternum
      runtime_kind:
        description: "Runtime kind"
        required: true
        type: choice
        options:
          - katana
          - torii
      runtime_name:
        description: "Runtime name"
        required: true
        type: string
      runtime_instance_id:
        description: "Immutable runtime instance id"
        required: true
        type: string
      expected_delete_after:
        description: "Exact DeleteAfter timestamp required for teardown"
        required: false
        default: ""
        type: string
      tier:
        description: "Fixed runtime tier"
        required: false
        default: basic
        type: choice
        options:
          - basic
          - pro
          - epic
          - legendary
      image_digest:
        description: "Approved runtime image digest"
        required: false
        default: ""
        type: string
      registry_json:
        description: "Registry scope, activation, and optional Slot rollback endpoints"
        required: false
        default: '{"scope":"game","activate":false,"slotFallbackEndpoints":{}}'
        type: string
      request_json:
        description: "Optional JSON object containing secondary runtime fields"
        required: false
        default: "{}"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group:
    aws-runtime-${{ inputs.environment || github.event.inputs.environment }}-${{ inputs.runtime_name ||
    github.event.inputs.runtime_name }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Reconcile AWS runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_RUNTIME_CLUSTER: ${{ vars.AWS_RUNTIME_CLUSTER }}
      AWS_RUNTIME_DOMAIN: ${{ vars.AWS_RUNTIME_DOMAIN || 'runtime.realms.world' }}
      AWS_RUNTIME_ECR_REPOSITORY_URL: ${{ vars.AWS_RUNTIME_ECR_REPOSITORY_URL }}
      AWS_RUNTIME_ECR_IMAGE: ${{ vars.AWS_RUNTIME_ECR_IMAGE }}
      AWS_RUNTIME_TASK_EXECUTION_ROLE_ARN: ${{ vars.AWS_RUNTIME_TASK_EXECUTION_ROLE_ARN }}
      AWS_RUNTIME_TASK_ROLE_ARN: ${{ vars.AWS_RUNTIME_TASK_ROLE_ARN }}
      AWS_RUNTIME_SUBNET_IDS: ${{ vars.AWS_RUNTIME_SUBNET_IDS }}
      AWS_RUNTIME_SECURITY_GROUP_IDS: ${{ vars.AWS_RUNTIME_SECURITY_GROUP_IDS }}
      AWS_RUNTIME_EFS_FILE_SYSTEM_ID: ${{ vars.AWS_RUNTIME_EFS_FILE_SYSTEM_ID }}
      AWS_RUNTIME_VPC_ID: ${{ vars.AWS_RUNTIME_VPC_ID }}
      AWS_RUNTIME_ALB_LISTENER_ARN: ${{ vars.AWS_RUNTIME_ALB_LISTENER_ARN }}
      AWS_RUNTIME_ALB_LISTENER_ARNS: ${{ vars.AWS_RUNTIME_ALB_LISTENER_ARNS }}
      AWS_RUNTIME_LOG_GROUP: ${{ vars.AWS_RUNTIME_LOG_GROUP || '/ecs/eternum-game-runtime' }}
      AWS_RUNTIME_SNS_TOPIC_ARN: ${{ vars.AWS_RUNTIME_SNS_TOPIC_ARN }}
      AWS_RUNTIME_CONTROL_TABLE_NAME: ${{ vars.AWS_RUNTIME_CONTROL_TABLE_NAME }}
      AWS_RUNTIME_REQUIRE_CONTROL_TABLE: ${{ vars.AWS_RUNTIME_REQUIRE_CONTROL_TABLE || 'true' }}
      AWS_RUNTIME_CORS_ORIGINS: ${{ vars.AWS_RUNTIME_CORS_ORIGINS }}
      AWS_RUNTIME_HEALTH_START_PERIOD_SECONDS: ${{ vars.AWS_RUNTIME_HEALTH_START_PERIOD_SECONDS }}
      SELECTED_ROLE_ARN:
        ${{ github.event.inputs.operation == 'delete' && vars.AWS_MAINTENANCE_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME
        }}
      INPUT_OPERATION: ${{ github.event.inputs.operation }}
      INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
      INPUT_RUNTIME_KIND: ${{ github.event.inputs.runtime_kind }}
      INPUT_RUNTIME_NAME: ${{ github.event.inputs.runtime_name }}
      INPUT_RUNTIME_INSTANCE_ID: ${{ github.event.inputs.runtime_instance_id }}
      INPUT_EXPECTED_DELETE_AFTER: ${{ github.event.inputs.expected_delete_after }}
      INPUT_TIER: ${{ github.event.inputs.tier }}
      INPUT_IMAGE_DIGEST: ${{ github.event.inputs.image_digest || vars.AWS_RUNTIME_IMAGE_DIGEST }}
      INPUT_REGISTRY_JSON:
        ${{ github.event.inputs.registry_json || '{"scope":"game","activate":false,"slotFallbackEndpoints":{}}' }}
      INPUT_REQUEST_JSON: ${{ github.event.inputs.request_json || '{}' }}
      INPUT_UPSTREAM_RPC_SECRET_ARN: ${{ vars.AWS_RUNTIME_UPSTREAM_RPC_SECRET_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ env.SELECTED_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup ECS Exec client
        uses: ./.github/actions/setup-session-manager-plugin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reconcile runtime
        run: |
          set -euo pipefail

          args=(
            --operation "${INPUT_OPERATION}"
            --environment "${INPUT_ENVIRONMENT}"
            --runtime-kind "${INPUT_RUNTIME_KIND}"
            --runtime-name "${INPUT_RUNTIME_NAME}"
            --runtime-instance-id "${INPUT_RUNTIME_INSTANCE_ID}"
            --tier "${INPUT_TIER}"
          )

          request_file="${RUNNER_TEMP}/aws-runtime-request.json"
          printf '%s' "${INPUT_REQUEST_JSON}" > "${request_file}"
          args+=(--request-file "${request_file}")

          if [ -n "${INPUT_IMAGE_DIGEST}" ]; then
            args+=(--image-digest "${INPUT_IMAGE_DIGEST}")
          fi

          if [ -n "${INPUT_UPSTREAM_RPC_SECRET_ARN}" ]; then
            args+=(--upstream-rpc-secret-arn "${INPUT_UPSTREAM_RPC_SECRET_ARN}")
          fi

          if [ -n "${INPUT_EXPECTED_DELETE_AFTER}" ]; then
            args+=(--expected-delete-after "${INPUT_EXPECTED_DELETE_AFTER}")
          fi


          bun config/deployer/clean/cli/aws-runtime.ts "${args[@]}" | tee aws-runtime-result.json

      - name: Publish runtime registry
        if: ${{ github.event.inputs.operation != 'inspect' && vars.RUNTIME_REGISTRY_URL != '' }}
        env:
          FACTORY_WORKER_ADMIN_SECRET: ${{ secrets.FACTORY_WORKER_ADMIN_SECRET }}
          RUNTIME_REGISTRY_URL: ${{ vars.RUNTIME_REGISTRY_URL }}
        run: |
          set -euo pipefail

          registry_request_file="${RUNNER_TEMP}/aws-runtime-registry-request.json"
          printf '%s' "${INPUT_REGISTRY_JSON}" > "${registry_request_file}"
          jq -e '
            type == "object" and
            ((keys - ["activate", "scope", "slotFallbackEndpoints"]) | length == 0) and
            (.scope | IN("game", "factory", "global", "shared-chain")) and
            (.activate | type == "boolean") and
            (.slotFallbackEndpoints | type == "object")
          ' "${registry_request_file}" >/dev/null
          registry_scope="$(jq -r '.scope' "${registry_request_file}")"
          activate_registry="$(jq -r '.activate' "${registry_request_file}")"
          slot_fallback_endpoints="$(jq -c '.slotFallbackEndpoints' "${registry_request_file}")"

          registry_args=(--registry-url "${RUNTIME_REGISTRY_URL}")
          if [ "${INPUT_OPERATION}" = "delete" ]; then
            registry_args+=(--teardown-result-file aws-runtime-result.json)
          else
            registry_args+=(
              --artifact-file aws-runtime-result.json
              --scope "${registry_scope}"
              --provider aws
              --activate "${activate_registry}"
            )
            if [ "${slot_fallback_endpoints}" != "{}" ]; then
              registry_args+=(--fallback-endpoints-json "${slot_fallback_endpoints}")
            fi
          fi

          bun scripts/update-runtime-registry.ts "${registry_args[@]}" | tee runtime-registry-result.json

      - name: Upload runtime result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aws-runtime-result
          path: |
            aws-runtime-result.json
            runtime-registry-result.json
