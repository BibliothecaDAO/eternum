name: test mmr

on:
  workflow_call:

jobs:
  test-mmr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          tool-versions: .tool-versions
          scarb-lock: contracts/l2/mmr/Scarb.lock
      - uses: foundry-rs/setup-snfoundry@v3
        with:
          tool-versions: .tool-versions
      - name: Run MMR tests
        run: cd contracts/l2/mmr && snforge test
