name: AWS Runtime Image Promotion
run-name: Promote AWS runtime image / ${{ inputs.environment }} / ${{ inputs.source_image }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Protected mainnet GitHub environment"
        required: true
        type: choice
        options:
          - mainnet.blitz
          - mainnet.eternum
      source_image:
        description: "Signed non-production ECR image including sha256 digest"
        required: true
        type: string
      promotion_tag:
        description: "Immutable production tag, normally {dojoVersion}-{gitSha}"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-runtime-image-promotion-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and promote immutable digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_RUNTIME_ECR_REPOSITORY_URL: ${{ vars.AWS_RUNTIME_ECR_REPOSITORY_URL }}
      SELECTED_ENVIRONMENT: ${{ inputs.environment }}
      SOURCE_IMAGE: ${{ inputs.source_image }}
      PROMOTION_TAG: ${{ inputs.promotion_tag }}
      SCAN_EXCEPTION_EXPIRES_AT: ${{ vars.AWS_RUNTIME_SCAN_EXCEPTION_EXPIRES_AT }}
      EXPECTED_CERTIFICATE_IDENTITY:
        https://github.com/${{ github.repository }}/.github/workflows/aws-runtime-image.yml@refs/heads/next
    steps:
      - name: Configure production image role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_IMAGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Validate promotion request
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_IMAGE}" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "source_image must be an ECR image pinned to a sha256 digest" >&2
            exit 1
          fi
          if [[ ! "${PROMOTION_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?-[a-f0-9]{7,40}$ ]]; then
            echo "promotion_tag must be a canonical v-prefixed release version ending in a git SHA" >&2
            exit 1
          fi
          if [[ -z "${AWS_RUNTIME_ECR_REPOSITORY_URL}" ]]; then
            echo "AWS_RUNTIME_ECR_REPOSITORY_URL is required" >&2
            exit 1
          fi

      - name: Verify candidate signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${EXPECTED_CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${SOURCE_IMAGE}" > candidate-signature.json

      - name: Enforce vulnerability gate
        run: |
          set -euo pipefail
          source_without_digest="${SOURCE_IMAGE%@*}"
          source_registry="${source_without_digest%%/*}"
          source_registry_id="${source_registry%%.*}"
          source_repository="${source_without_digest#*/}"
          source_digest="${SOURCE_IMAGE##*@}"

          aws ecr describe-image-scan-findings \
            --region "${AWS_REGION}" \
            --registry-id "${source_registry_id}" \
            --repository-name "${source_repository}" \
            --image-id imageDigest="${source_digest}" \
            --output json > candidate-scan.json

          critical="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' candidate-scan.json)"
          high="$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' candidate-scan.json)"
          if (( critical == 0 && high == 0 )); then
            exit 0
          fi

          if [[ -z "${SCAN_EXCEPTION_EXPIRES_AT}" ]]; then
            echo "promotion rejected: ${critical} Critical and ${high} High findings" >&2
            exit 1
          fi
          exception_epoch="$(date -u -d "${SCAN_EXCEPTION_EXPIRES_AT}" +%s)"
          if (( exception_epoch <= $(date -u +%s) )); then
            echo "promotion rejected: vulnerability exception expired at ${SCAN_EXCEPTION_EXPIRES_AT}" >&2
            exit 1
          fi
          echo "Using time-bounded vulnerability exception expiring ${SCAN_EXCEPTION_EXPIRES_AT}" >&2

      - name: Copy approved image into production ECR
        id: promote
        run: |
          set -euo pipefail
          source_registry="${SOURCE_IMAGE%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" | \
            docker login --username AWS --password-stdin "${source_registry}"

          target_image="${AWS_RUNTIME_ECR_REPOSITORY_URL}:${PROMOTION_TAG}"
          docker buildx imagetools create --tag "${target_image}" "${SOURCE_IMAGE}"

          repository_name="${AWS_RUNTIME_ECR_REPOSITORY_URL##*/}"
          target_digest="$(aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${repository_name}" \
            --image-ids imageTag="${PROMOTION_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          cosign sign --yes "${AWS_RUNTIME_ECR_REPOSITORY_URL}@${target_digest}"

          echo "target_digest=${target_digest}" >> "${GITHUB_OUTPUT}"
          jq -n \
            --arg sourceImage "${SOURCE_IMAGE}" \
            --arg targetImage "${AWS_RUNTIME_ECR_REPOSITORY_URL}@${target_digest}" \
            --arg promotionTag "${PROMOTION_TAG}" \
            '{schemaVersion: 1, sourceImage: $sourceImage, targetImage: $targetImage, promotionTag: $promotionTag}' \
            > promotion.json

      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aws-runtime-image-promotion-${{ inputs.environment }}-${{ inputs.promotion_tag }}
          path: |
            candidate-signature.json
            candidate-scan.json
            promotion.json
          if-no-files-found: error
          retention-days: 365

      - name: Summarize promoted digest
        env:
          TARGET_DIGEST: ${{ steps.promote.outputs.target_digest }}
        run: |
          {
            echo "## Promoted AWS runtime image"
            echo "- Environment: \`${SELECTED_ENVIRONMENT}\`"
            echo "- Source: \`${SOURCE_IMAGE}\`"
            echo "- Production: \`${AWS_RUNTIME_ECR_REPOSITORY_URL}@${TARGET_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
