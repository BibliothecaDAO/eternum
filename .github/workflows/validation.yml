name: validation

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

# A pull request scopes from where it branched, so its newest run covers everything and older ones cancel. A run on next
# checks every core area and scopes other jobs to changed inputs. A newer merge cancels it too: only the newest commit
# of a burst of merges is guaranteed a run, and the deployment revision check names a cancelled run when it refuses to publish its commit.
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.paths.outputs.client }}
      herald: ${{ steps.paths.outputs.herald }}
      services: ${{ steps.paths.outputs.services }}
      portal: ${{ steps.paths.outputs.portal }}
      native: ${{ steps.paths.outputs.native }}
      runtime: ${{ steps.paths.outputs.runtime }}
      terrain: ${{ steps.paths.outputs.terrain }}
      amm: ${{ steps.paths.outputs.amm }}
      collectibles: ${{ steps.paths.outputs.collectibles }}
      mmr: ${{ steps.paths.outputs.mmr }}
      season_pass: ${{ steps.paths.outputs.season_pass }}
      contract_scripts: ${{ steps.paths.outputs.contract_scripts }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      # One shallow commit holding only the scripts: diff-base.sh fetches the history its measurement needs.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Select validation areas
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Core areas always run on next. Other checks follow the push's full changed-path range.
          EVERY_AREA=false
          BASE_SHA=$(bash .github/scripts/diff-base.sh)
          if [ -z "$BASE_SHA" ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::Cannot resolve the push base for $HEAD_SHA"
              exit 1
            fi
            echo "::warning title=Every area selected::no base resolved for $HEAD_SHA, so this run checks every area"
            EVERY_AREA=true
          fi
          echo "Measuring $HEAD_SHA from $BASE_SHA"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          export EVERY_AREA BASE_SHA
          python3 - <<'PYTHON'
          import json, os, subprocess, sys
          sys.path.insert(0, ".github/scripts")
          from validation_areas import selected_areas
          every_area = os.environ["EVERY_AREA"] == "true"
          files = [] if every_area else subprocess.check_output(["git", "diff", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]).decode().split("\0")
          selected = selected_areas(files, every_area, landing=os.environ["EVENT"] == "push")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for area, enabled in selected.items():
                  print(f"{area}={str(enabled).lower()}", file=output)
          print(json.dumps(selected, sort_keys=True))
          PYTHON
      # Only the commits a pull request's event adds: a push to it adds those after its previous head, a new pull
      # request all of its own. Commits already on next are accepted history and are not judged again, so a pull
      # request from next into main adds none. The landing push to next carries only commits its pull request
      # already passed.
      - name: Refuse AI authorship and trailers in the commits a pull request adds
        if: github.event_name == 'pull_request' && github.event.action != 'reopened' && steps.paths.outputs.base != ''
        env:
          ADDED_AFTER: ${{ github.event.action == 'synchronize' && github.event.before || steps.paths.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet --no-tags --filter=blob:none origin "$ADDED_AFTER" || true
          git fetch --quiet --no-tags --filter=blob:none origin +refs/heads/next:refs/remotes/origin/next
          python3 .github/scripts/check_commit_attribution.py "$HEAD_SHA" "$ADDED_AFTER" origin/next

  static:
    uses: ./.github/workflows/static.yml

  client:
    needs: scope
    if: needs.scope.outputs.client == 'true'
    uses: ./.github/workflows/test-client.yml

  herald:
    needs: scope
    if: needs.scope.outputs.herald == 'true'
    uses: ./.github/workflows/test-herald.yml

  services:
    needs: scope
    if: needs.scope.outputs.services == 'true'
    uses: ./.github/workflows/test-services.yml

  portal:
    needs: scope
    if: needs.scope.outputs.portal == 'true'
    uses: ./.github/workflows/test-portal.yml

  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    uses: ./.github/workflows/test-native.yml

  runtime:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/test-agent-runtime.yml

  terrain:
    needs: scope
    if: needs.scope.outputs.terrain == 'true'
    uses: ./.github/workflows/verify-terrain.yml

  amm:
    needs: scope
    if: needs.scope.outputs.amm == 'true'
    uses: ./.github/workflows/test-ammv2.yml

  collectibles:
    needs: scope
    if: needs.scope.outputs.collectibles == 'true'
    uses: ./.github/workflows/test-collectibles.yml

  mmr:
    needs: scope
    if: needs.scope.outputs.mmr == 'true'
    uses: ./.github/workflows/test-mmr.yml

  season_pass:
    needs: scope
    if: needs.scope.outputs.season_pass == 'true'
    uses: ./.github/workflows/test-season-pass.yml

  contract_scripts:
    needs: scope
    if: needs.scope.outputs.contract_scripts == 'true'
    uses: ./.github/workflows/test-contract-scripts.yml

  docs:
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    uses: ./.github/workflows/test-docs.yml

  validation:
    name: validation
    if: always()
    needs:
      [
        scope,
        static,
        client,
        herald,
        services,
        portal,
        native,
        runtime,
        terrain,
        amm,
        collectibles,
        mmr,
        season_pass,
        contract_scripts,
        docs,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected area
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          scope = results["scope"]
          passed = scope["result"] == "success" and results["static"]["result"] == "success"
          for area, job in results.items():
              if area in ("scope", "static"):
                  continue
              expected = "success" if scope["outputs"].get(area) == "true" else "skipped"
              passed = passed and job["result"] == expected
          print(json.dumps({"passed": passed, "areas": results}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PYTHON
