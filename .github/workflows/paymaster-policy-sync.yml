name: Paymaster Policy Sync

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network (mainnet|sepolia|appchain|local)"
        required: true
        default: "mainnet"
      game_name:
        description: "Game/world name (example: waterbox-batch-cooking)"
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build required packages
        run: |
          set -euo pipefail
          pnpm --dir packages/types build

      - name: Build actions and apply paymaster policy
        run: |
          bun scripts/ci/paymaster/sync-policy.ts \
            --chain "${{ github.event.inputs.network }}" \
            --game "${{ github.event.inputs.game_name }}" \
            --paymaster "empire" \
            --yes
