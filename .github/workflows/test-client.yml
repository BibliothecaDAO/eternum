name: client

on:
  workflow_call:

jobs:
  test-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Live deployment checks run in deploy/first: a PR gate must
    # stay hermetic — external infra (a live node blip) must not be
    # able to fail it — and "does the built artifact boot" is a question
    # answered where the artifact ships.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      # Only the media the icon check and the client's tests read, found by tracing every file the job's steps open,
      # stat or list. A step that starts reading anything else fails with ENOENT; add its path here.
      - uses: ./.github/actions/checkout-without-media
        with:
          keep: |
            apps/game/asset-sources/facets/masters
            apps/game/asset-sources/frontier-beasts
            apps/game/asset-sources/lab/realm-level-icons
            apps/game/asset-sources/lab/rss-icons/before
            apps/game/asset-sources/lab/rss-icons/history
            apps/game/asset-sources/reward-chests/originals
            apps/game/asset-sources/rss-icons/selected
            apps/game/public/icons/facets
            apps/game/public/images/blitz-chests
            apps/game/public/images/buildings/construction
            apps/game/public/images/covers/link-preview-54d58004.png
            apps/game/public/images/festival
            apps/game/public/images/landscapes
            apps/game/public/images/logos
            apps/game/public/models/biome-creatures
            apps/game/public/models/characters/quaternius
            apps/game/public/models/characters/t1-knight-default
            apps/game/public/models/ethereal
            apps/game/public/models/frontier
            apps/game/public/models/new-buildings-opt
            apps/game/public/models/outposts
            apps/game/public/models/realms
            apps/game/public/models/reward-tiles
            scripts/icons/fixtures

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check forbidden dependencies and browser endpoints
        run: pnpm check:forbidden-hosts

      - name: Build packages
        run: pnpm run build:packages

      - name: Validate painted icons
        run: pnpm icons:check

      - name: Check the shell names its sizes, colours and radii through the tokens
        run: pnpm shell:check

      - name: Check the HUD adds no look of its own beside the sheet
        run: pnpm hud:check

      - name: Check every word, number, time and name goes through the words module
        run: pnpm words:check

      - name: Check site previews come from the Cairo payout rules
        run: node --test contracts/l3/world-native/scripts/site-previews.test.mjs

      - name: Typecheck game client
        run: pnpm --dir ./apps/game typecheck

      - name: Hold the client and its packages to the lint guards
        run: pnpm --dir ./apps/game lint:guards

      - name: Check the patch notes are rendered from their releases
        working-directory: apps/game
        run: node scripts/generate-patch-notes.mjs && git diff --exit-code src/shell/generated/patch-notes.ts

      - name: Run game client tests
        run: pnpm --dir ./apps/game test

      - name: Test the client deploy's checks
        run: >-
          node --test apps/game/scripts/ensure-pwa-cache-rule.test.mjs
          apps/game/scripts/verify-client-deployment.test.mjs apps/game/scripts/verify-pwa-build.test.mjs
          apps/game/scripts/check-map-client-isolation.test.mjs

      - name: Check a production build keeps the map client under trial out of a page that does not ask for it
        env:
          # A placeholder the build requires, shaped as the guard demands; nothing in the build calls the RPC.
          VITE_PUBLIC_L2_RPC_URL: https://starknet-mainnet.g.alchemy.com/starknet/version/rpc/v0_9/isolation-check
        run: pnpm --dir ./apps/game check:map-client-isolation

      - name: Test native store, commands and sync recovery
        run: pnpm --dir packages/core exec vitest run

      - name: Test shared coordinates, chain guards and market calculations
        run: |
          pnpm --dir packages/types exec vitest run
          pnpm --dir packages/chain test
          pnpm --dir packages/ammv2-sdk test
