name: client

on:
  workflow_call:

jobs:
  test-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Placeholder endpoints, baked in by env parsing during tests.
      # The live renderer smokes moved to deploy-client.yml: a PR gate must
      # stay hermetic — external infra (a live node blip) must not be
      # able to fail it — and "does the built artifact boot" is a question
      # answered where the artifact ships.
      VITE_PUBLIC_SHARD_URL: "https://herald.realms.test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check forbidden dependencies and browser endpoints
        run: pnpm check:forbidden-hosts

      - name: Build packages
        run: pnpm run build:packages

      - name: Typecheck game client
        run: pnpm --dir ./apps/game typecheck

      - name: Run game client tests
        run: pnpm --dir ./apps/game test

      - name: Test native store, commands and sync recovery
        run: pnpm --dir packages/core exec vitest run

      - name: Test shared coordinates, chain guards and market calculations
        run: |
          pnpm --dir packages/types exec vitest run
          pnpm --dir packages/chain test
          pnpm --dir packages/ammv2-sdk test
