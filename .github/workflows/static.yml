name: static

on:
  workflow_call:

jobs:
  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for unused files, exports and types
        run: pnpm run knip

      - name: Check a pull request is measured from where it branched
        run: bash .github/scripts/diff-base.test.sh

      - name: Check that only a landing validation run validates a publish
        run: python3 -m unittest discover -s deploy/athanor/scripts -p "test_revision.py"

      - name: Check that each validation area covers every file its checks read and owns the CI files that run it
        run: python3 .github/scripts/check_validation_areas.py

      - name: Test that a CI file selects only the area that owns it
        run: python3 .github/scripts/test_validation_areas.py

      - name: Test the check that refuses AI attribution in commits
        run: python3 .github/scripts/test_commit_attribution.py

      - uses: oven-sh/setup-bun@v2

      - name: Check workflows cannot read stored secrets
        run: bun test ./.github/scripts/workflow-credentials.test.ts

      - name: Check committed env files name no third-party RPC
        run: |
          node --test scripts/check-committed-env-rpc.test.mjs
          node scripts/check-committed-env-rpc.mjs

      - name: Check every package's test script runs once
        run: |
          node --test scripts/check-test-scripts-run-once.test.mjs
          node scripts/check-test-scripts-run-once.mjs

      - name: Check formatting
        run: pnpm run format:check
