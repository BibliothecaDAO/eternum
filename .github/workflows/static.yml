name: static

on:
  workflow_call:

jobs:
  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for unused files, exports and types
        run: pnpm run knip

      - name: Check the diff base keeps every unlanded commit in scope
        run: bash .github/scripts/diff-base.test.sh

      - name: Check committed env files name no third-party RPC
        run: |
          node --test scripts/check-committed-env-rpc.test.mjs
          node scripts/check-committed-env-rpc.mjs

      - name: Check changed-file formatting
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          BASE_SHA=$(bash .github/scripts/diff-base.sh)
          export BASE_SHA
          echo "Measuring $HEAD_SHA from $BASE_SHA"
          mapfile -d '' -t changed < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")
          pnpm run format
          if ((${#changed[@]})); then
            git diff --exit-code -- "${changed[@]}"
          fi

      - name: Record formatting diff
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/format.patch"

      - name: Upload formatting diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-diff
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: error
