name: knip

on:
  pull_request:
    paths-ignore:
      - "eliza/**"
      - "contracts/**"
      - "**/manifest.json"
      - ".github/**"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Install dependencies
        run: pnpm i

      - name: Run knip
        run: pnpm knip

      - name: Check AWS runtime IAM policy
        run: pnpm run check:aws-runtime-iam

      - name: Check AWS runtime README variable parity
        run: pnpm run check:aws-runtime-readme

      - name: Check AWS runtime Terraform backend
        run: pnpm run check:aws-runtime-terraform

      - name: Check AWS runtime URL builders
        run: pnpm run check:aws-runtime-urls
