name: knip

on:
  pull_request:
    paths-ignore:
      - "eliza/**"
      - "contracts/**"
      - "**/manifest.json"
      - ".github/**"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: pnpm/action-setup@v3
        with:
          version: 9.7.0

      - name: Install dependencies
        run: pnpm i

      - name: Run knip
        run: pnpm knip

      - name: Check AWS runtime IAM policy
        run: pnpm run check:aws-runtime-iam

      - name: Check AWS runtime README variable parity
        run: pnpm run check:aws-runtime-readme

      - name: Check AWS runtime Terraform backend
        run: pnpm run check:aws-runtime-terraform

      - name: Check AWS runtime URL builders
        run: pnpm run check:aws-runtime-urls
