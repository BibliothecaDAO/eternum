name: Blitz Rotation Tick

# Ticks the two daily appchain blitz rotations (blitz-herald 11:00 UTC,
# blitz-nightwatch 20:00 UTC) by dispatching the Game Launch workflow. Each
# rotation evaluation is idempotent: it creates only the games missing from
# its advance window and retries any failed launch step, so a quiet tick is
# cheap and a failed one self-heals on the next.
#
# Scheduled workflows run from the default branch (next); the dispatched
# launches also run on next so they read the rotation configs from there.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: blitz-rotation-tick
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch rotation evaluations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for config_path in \
            config/deployer/clean/launch-configs/appchain-blitz-herald.yaml \
            config/deployer/clean/launch-configs/appchain-blitz-nightwatch.yaml; do
            gh workflow run game-launch.yml \
              --repo "${{ github.repository }}" \
              --ref next \
              -f launch_kind=rotation \
              -f environment=appchain.blitz \
              -f config_path="${config_path}"
          done
