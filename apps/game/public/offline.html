<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#130F0C" />
    <title>Realms — Offline</title>
    <!-- The installed app's page with no connection (spec 14): the mark on the ground, Offline and Try again. Colours are
         the token file's (src/tokens.ts); only precached files may load here. -->
    <style>
      :root {
        color-scheme: dark;
        background: #130f0c;
        color: #f4ebdc;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        margin: 2rem;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
      }
      button {
        min-height: 48px;
        padding: 0 1.5rem;
        border: 2px solid #6b5230;
        border-radius: 16px;
        background: transparent;
        color: #f4ebdc;
        font:
          600 1rem system-ui,
          sans-serif;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #f6c297;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/game-pwa-192x192.png" alt="Realms" />
      <h1>Offline</h1>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
