<!doctype html>
<!--
  The realm card's stills (public/images/realm-card/SOURCE.md). Served by the game's dev server, it draws the board's
  ground, then offers the still as WebP. The tier stills are captures of the realm view itself (SOURCE.md).
-->
<html>
  <body style="margin: 0; background: #15100a">
    <a id="still" download hidden>Save still</a>
    <script type="module">
      import * as THREE from "three";

      const WIDTH = 1200;
      const HEIGHT = 900;
      const SPAN = 30;
      const DISTANCE = 8.2;

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(WIDTH, HEIGHT);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      document.body.prepend(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1e2512);
      scene.fog = new THREE.Fog(0x1e2512, DISTANCE + 3, DISTANCE + 10);
      scene.add(new THREE.HemisphereLight(0xfff1d6, 0x3a2c18, 1.6));
      const sun = new THREE.DirectionalLight(0xffe2b0, 3.2);
      sun.position.set(-4, 8, 6);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.bias = -0.0005;
      Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, far: 40 });
      scene.add(sun);

      // Seeded value noise, so every render of the ground is the same field.
      const noiseField = () => {
        let seed = 7;
        const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const octaves = [60, 180, 420, 900].map((cells) => ({
          cells,
          values: Array.from({ length: (cells + 1) ** 2 }, random),
        }));
        const sample = ({ cells, values }, u, v) => {
          const x = u * cells,
            y = v * cells,
            ix = Math.floor(x),
            iy = Math.floor(y);
          const sx = (x - ix) ** 2 * (3 - 2 * (x - ix)),
            sy = (y - iy) ** 2 * (3 - 2 * (y - iy));
          const at = (dx, dy) => values[(iy + dy) * (cells + 1) + ix + dx];
          const top = at(0, 0) + (at(1, 0) - at(0, 0)) * sx;
          const bottom = at(0, 1) + (at(1, 1) - at(0, 1)) * sx;
          return top + (bottom - top) * sy;
        };
        return {
          random,
          at: (u, v) => octaves.reduce((sum, octave, i) => sum + sample(octave, u, v) / 2 ** i, 0) / 1.875,
        };
      };

      // The board's grass.
      const groundTexture = () => {
        const size = 2048;
        const canvas = Object.assign(document.createElement("canvas"), { width: size, height: size });
        const context = canvas.getContext("2d");
        const pixels = context.createImageData(size, size);
        const noise = noiseField();
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const u = x / size,
              v = y / size,
              n = noise.at(u, v),
              blade = noise.random() * 0.12,
              lush = Math.min(1, Math.max(0, (n - 0.5) * 1.5 + 0.5));
            const grass = [30 + lush * 62 + blade * 40, 46 + lush * 74 + blade * 50, 18 + lush * 26];
            const i = (y * size + x) * 4;
            for (let c = 0; c < 3; c++) pixels.data[i + c] = grass[c];
            pixels.data[i + 3] = 255;
          }
        }
        context.putImageData(pixels, 0, 0);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 8;
        return texture;
      };

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(SPAN, SPAN),
        new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 1 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // The three-quarter angle the realm card has always shown its ground from.
      const camera = new THREE.PerspectiveCamera(24, WIDTH / HEIGHT, 0.01, 100);
      const aim = new THREE.Vector3(0, 0.9, 0);
      camera.position.copy(aim).addScaledVector(new THREE.Vector3(0.55, 0.62, 1).normalize(), DISTANCE);
      camera.lookAt(aim);
      renderer.render(scene, camera);

      const link = document.getElementById("still");
      link.href = renderer.domElement.toDataURL("image/webp", 0.86);
      link.download = "ground.webp";
      link.hidden = false;
    </script>
  </body>
</html>
