    <style>
      /* The first frame (spec 14): the lockup on the ground, the same as the install's splash; never a black page. */
      html[data-boot-state="booting"] body,
      html[data-boot-state="react-mounted"] body {
        background: #130f0c;
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #130f0c;
        transition:
          opacity 360ms ease,
          visibility 360ms ease;
      }

      #boot-shell img {
        width: min(60vw, 240px);
        height: auto;
      }

      html[data-boot-state="app-loading"] #boot-shell,
      html[data-boot-state="app-ready"] #boot-shell {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script>
      document.documentElement.dataset.bootState = "booting";
      if (window.performance && typeof window.performance.mark === "function") {
        try {
          window.performance.mark("boot_html_visible");
        } catch {}
      }
    </script>
    <div id="boot-shell" aria-hidden="true">
      <img src="/images/logos/realms-lockup.svg" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
