    <style>
      /* brand: written from apps/game/src/tokens.ts by apps/game/scripts/build-brand-surfaces.ts */
      :root {
        --ground: #130f0c;
        --plate: #201a16;
        --plate2: #2a221c;
        --line: #46351c;
        --line2: #6b5230;
        --cream: #f4ebdc;
        --muted: #b7a78a;
        --gold: #dfaa54;
        --gold2: #f3d08a;
        --peach: #f6c297;
        --amber: #e39001;
        --ember: #ef5858;
        --red: #fc4c4c;
        --sage: #b5bd75;
        --hot: #f6ac1d;
        --ink: #1b1207;
        --veil: #0a0806;
        --shade: #000000;
      }
      /* brand: end */

      /* The first frame (spec 14): the lettered mark on the ground, the same as the install's splash; never a black page. */
      html[data-boot-state="booting"] body,
      html[data-boot-state="react-mounted"] body {
        background: var(--ground);
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: var(--ground);
        transition:
          opacity 360ms ease,
          visibility 360ms ease;
      }

      #boot-shell img {
        width: min(60vw, 240px);
        height: auto;
      }

      html[data-boot-state="app-loading"] #boot-shell,
      html[data-boot-state="app-ready"] #boot-shell {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script>
      document.documentElement.dataset.bootState = "booting";
      if (window.performance && typeof window.performance.mark === "function") {
        try {
          window.performance.mark("boot_html_visible");
        } catch {}
      }
    </script>
    <div id="boot-shell" aria-hidden="true">
      <img src="/images/logos/realms-lettered.webp" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
