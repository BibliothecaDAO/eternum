    <style>
      /* brand: written from apps/game/src/tokens.ts by apps/game/scripts/build-brand-surfaces.ts */
      :root {
        --ground: #130f0c;
        --plate: #201a16;
        --plate2: #2a221c;
        --line: #46351c;
        --line2: #6b5230;
        --cream: #f4ebdc;
        --muted: #b7a78a;
        --gold: #dfaa54;
        --gold2: #f3d08a;
        --peach: #f6c297;
        --amber: #e39001;
        --ember: #ef5858;
        --red: #fc4c4c;
        --sage: #b5bd75;
        --hot: #f6ac1d;
        --ink: #1b1207;
        --veil: #0a0806;
        --shade: #000000;
      }
      /* brand: end */

      /* The first frame (spec 14): the lettered mark on the ground, the same as the install's splash; never a black page. */
      html[data-boot-state="booting"] body,
      html[data-boot-state="react-mounted"] body {
        background: var(--ground);
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--ground);
        transition:
          opacity 360ms ease,
          visibility 360ms ease;
      }

      .boot-shell__painting {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 45%;
      }

      .boot-shell__scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 92% 54% at 50% 18%,
            color-mix(in srgb, var(--gold) 36%, transparent) 0%,
            transparent 72%
          ),
          linear-gradient(
            180deg,
            color-mix(in srgb, var(--ground) 44%, transparent) 0%,
            color-mix(in srgb, var(--ground) 20%, transparent) 44%,
            color-mix(in srgb, var(--ground) 70%, transparent) 78%,
            var(--ground) 100%
          );
      }

      #boot-shell > main {
        position: relative;
        z-index: 1;
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem 1rem;
      }

      .boot-shell__lockup {
        display: block;
        width: auto;
        height: clamp(8.5rem, 23dvh, 11.75rem);
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgb(0 0 0 / 0.65));
      }

      #boot-shell footer {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 0 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      }

      @media (max-width: 1023px) {
        #boot-shell > main {
          justify-content: flex-start;
          padding-top: max(2.25rem, env(safe-area-inset-top));
        }
      }

      @media (min-width: 1024px) {
        #boot-shell footer {
          padding: 0 1.75rem 1.5rem;
        }
      }

      #boot-shell i {
        position: relative;
        display: block;
        width: 100%;
        height: 0.5rem;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
        border-radius: 9999px;
        background: color-mix(in srgb, var(--plate2) 82%, transparent);
      }

      #boot-shell i::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: 9999px;
        background: linear-gradient(90deg, var(--gold), var(--gold2));
        animation: boot-shell-bar 1.5s ease-in-out infinite;
      }

      @keyframes boot-shell-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(270%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-shell i::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }

      html[data-boot-state="app-loading"] #boot-shell,
      html[data-boot-state="app-ready"] #boot-shell {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script>
      document.documentElement.dataset.bootState = "booting";
      if (window.performance && typeof window.performance.mark === "function") {
        try {
          window.performance.mark("boot_html_visible");
        } catch {}
      }
    </script>
    <div id="boot-shell" aria-hidden="true">
      <img src="%BOOT_MIST_SRC%" srcset="%BOOT_MIST_SRCSET%" sizes="100vw" alt="" class="boot-shell__painting" />
      <div class="boot-shell__scrim"></div>
      <main>
        <img src="/images/logos/frontier-lockup.webp" alt="" class="boot-shell__lockup" />
      </main>
      <footer>
        <i></i>
      </footer>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
