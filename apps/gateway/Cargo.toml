[package]
name = "realms-gateway"
description = "Admission gateway: signed game intents to recorded executions beside a stock Madara node"
version = "0.1.0"
edition = "2021"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
futures = "0.3.31"
hyper = { version = "0.14.32", features = ["server", "http1", "tcp"] }
jsonrpsee = { version = "0.22.5", features = ["server", "http-client"] }
rustix = { version = "1.1.2", features = ["rand"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
starknet-crypto = "0.8.1"
starknet-types-core = { version = "0.2.4", features = ["hash", "serde"] }
thiserror = "2.0.17"
tokio-tungstenite = "0.26.2"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
sha3 = "0.10"

[dev-dependencies]
num-bigint = "0.4.6"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["test-util"] }
