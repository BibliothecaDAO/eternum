[package]
name = "herald-poseidon"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
starknet-crypto = { version = "0.8.1", default-features = false }
starknet-types-core = { version = "0.2", default-features = false }
lol_alloc = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
