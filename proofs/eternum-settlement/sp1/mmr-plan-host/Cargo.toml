sp1-sdk = { git = "https://github.com/succinctlabs/sp1.git", tag = "v6.2.2", features = ["blocking"] }

[build-dependencies]
sp1-build = { git = "https://github.com/succinctlabs/sp1.git", tag = "v6.2.2" }

[lints.rust]
unsafe_code = "forbid"
