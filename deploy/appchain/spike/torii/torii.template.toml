# Multi-world torii config template — rendered to torii.toml by
# scripts/deploy-worlds.sh. This is THE architecture bet of Phase 1: one torii
# indexes every game world on the appchain (multiple WORLD entries below), so
# there is deliberately NO top-level `world_address` key.
rpc = "http://katana:5050"
db_dir = "/data/torii-db-v1"

[indexing]
events_chunk_size = 1024
blocks_chunk_size = 10240
pending = true
polling_interval = 250
controllers = true
pre_confirmed = true
max_concurrent_tasks = 100
transactions = true

contracts = [
	"WORLD:{WORLD_1}",
	"WORLD:{WORLD_2}",
]

namespaces = ["s1_eternum"]

world_block = 0

[erc]
max_metadata_tasks = 10

[events]
raw = true
