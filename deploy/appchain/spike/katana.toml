# Realms appchain spike — katana config.
#
# CAUTION: chain-id, [cartridge], [paymaster] and vrf must be CLI flags, NOT
# config keys. On rc.9, `chain_id` in this file is silently ignored, and
# [cartridge]/[paymaster] sections leave paymaster.cartridge_api unset, which
# panics at args.rs:315 the moment VRF starts. The flags live in
# docker-compose.yml.

[dev]
dev = true
no_fee = true
seed = "0"
total_accounts = 20

[server]
http_addr = "0.0.0.0"
http_port = 5050
http_cors_origins = "*"
timeout = 300

[starknet]
env.invoke_max_steps = 25000000

[metrics]
metrics = true
metrics_addr = "0.0.0.0"
metrics_port = 9100
