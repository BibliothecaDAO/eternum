# Realms appchain M0 spike: katana (WP_REALMS_DEV) + heartbeat + multi-world torii.
#
#   docker-compose up -d --build            # katana + heartbeat
#   scripts/deploy-worlds.sh                # two blitz worlds + torii config
#   docker-compose --profile torii up -d    # torii, after worlds exist
#
# torii starts under a profile because its config lists explicit world
# addresses, which only exist after deploy-worlds.sh has run.
version: "3.8"

services:
  katana:
    build: ./docker/katana
    image: realms-appchain-katana:rc9-spike
    # chain-id / cartridge / paymaster / vrf are CLI flags on purpose — rc.9
    # ignores or panics on their config-file equivalents (see katana.toml).
    command:
      - /bin/sh
      - -c
      - >-
        exec katana --config /config/katana.toml --data-dir /data/katana-db-v1
        --chain-id WP_REALMS_DEV
        --cartridge.controllers
        --paymaster --cartridge.paymaster
        --paymaster.bin /usr/local/bin/paymaster-service
        --vrf --vrf.bin /usr/local/bin/vrf-server-untagged
    environment:
      RUST_LOG: info
    volumes:
      - ./katana.toml:/config/katana.toml:ro
      - katana-data:/data
    ports:
      - "5050:5050"
      - "9100:9100"

  # Mines an empty block every 30s so get_block_timestamp advances while idle.
  # --block-time is broken on rc.9 (one block at startup, then a frozen head).
  # Non-essential by design: a dead heartbeat must never take the sequencer
  # down; -f keeps failures quiet and the loop retries next tick, which also
  # covers the window before katana is listening.
  heartbeat:
    image: realms-appchain-katana:rc9-spike
    depends_on:
      - katana
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
        curl -sf -m 10 -o /dev/null -X POST -H 'content-type: application/json'
        -d '{"jsonrpc":"2.0","id":1,"method":"dev_generateBlock","params":[]}'
        http://katana:5050 || true;
        sleep 30; done

  torii:
    # v1.8.16 + multi-world graphql patch (see docker/torii/Dockerfile);
    # stage the patched binary with scripts/build-torii.sh first.
    build: ./docker/torii
    image: realms-appchain-torii:1.8.16-mw-patch
    profiles: ["torii"]
    depends_on:
      - katana
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec torii --config /config/torii.toml
        --http.addr 0.0.0.0 --http.port 8080
        --http.cors_origins "*"
    volumes:
      - ./torii/torii.toml:/config/torii.toml:ro
      - torii-data:/data
    ports:
      - "8080:8080"

volumes:
  katana-data:
  torii-data:
