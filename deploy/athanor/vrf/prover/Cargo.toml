[package]
name = "realms-vrf-prover"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
realms-stark-vrf-math = { path = "vendor" }
ark-ff = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starknet-crypto = "0.8.1"
[profile.release]
lto = "thin"
codegen-units = 1
