[package]
name = "node-first-vrf-prover"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
node-first-stark-vrf-math = { path = "vendor" }
ark-ff = "0.5.0"
starknet-crypto = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
lto = "thin"
codegen-units = 1
