# Madara chain config for the Realms lab. Derived from the upstream `devnet` preset for v0.11.0-alpha.9
# (configs/presets/devnet.yaml); every changed key is documented in the lab README. Keep this file complete — Madara
# refuses partial configs, and a silent default here is a silent default in every measurement.
config_version: 2
chain_name: "Realms Madara Lab"
chain_id: "WP_REALMS_MADARA_LAB"
feeder_gateway_url: "http://localhost:8080/feeder_gateway/"
gateway_url: "http://localhost:8080/gateway/"
native_fee_token_address: "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d"
parent_fee_token_address: "0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7"
latest_protocol_version: "0.14.2"
# Game clocks read get_block_timestamp: keep closed blocks frequent so time advances while idle.
# Pre-confirmed blocks give sub-second inclusion independently of this value.
block_time: "2s"
pending_block_update_time: "250ms"
# Pre-confirmed state is persisted after each execution batch. Four bounds the work before that observation. The
# block bouncer limits are deliberately above the N=8 offered load so the headroom run finds Madara's wall, not a lab
# ceiling chosen in this file.
execution_batch_size: 4
bouncer_config:
  block_max_capacity:
    sierra_gas: 100000000000
    message_segment_length: 37000
    n_events: 50000
    state_diff_size: 40000
    l1_gas: 25000000
    n_txs: 256
    proving_gas: 100000000000
    receipt_l2_gas: 100000000000
  builtin_weights:
    gas_costs:
      pedersen: 3000
      range_check: 90
      ecdsa: 2000000
      ecop: 857850
      bitwise: 583
      keccak: 600000
      poseidon: 10000
      add_mod: 2000
      mul_mod: 2000
      range_check96: 179
      blake: 3334
sequencer_address: "0x123"
eth_core_contract_address: "0x9bd03768a7dcc129555de410ff8e85528a4f88b5"
eth_gps_statement_verifier: "0xf294781D719D2F4169cE54469C28908E6FA752C1"
mempool_max_transactions: 10000
mempool_max_declare_transactions: 20
mempool_ttl: null
l2_gas_price:
  type: eip1559
  target: 2000000000
  min_price: 100000
  max_change_denominator: 48
