name: ${SHARD_NAME:?Choose a unique shard name}

x-madara-image: &madara-image ghcr.io/madara-alliance/madara@sha256:efaa800354602ad89fa2f22492e55188f50b0fc5675f66cba8184f0e261394f5

x-init: &init
  image: ${SHARD_INIT_IMAGE:?Use the published init image digest}
  volumes:
    - ${SHARD_DATA:-./data}:/data
    - public-config:/public
    - herald-config:/herald-config
    - postgres-config:/postgres-config
    - type: bind
      source: /opt/athanor/operator-token
      target: /opt/athanor/operator-token
      read_only: true
      bind: { create_host_path: false }
  environment:
    CHAIN_ID: ${CHAIN_ID:?Choose a unique chain id}
    GUARDIAN_URL: ${GUARDIAN_URL:?Set the identity guardian endpoint}
    PUBLIC_RPC_URL: ${PUBLIC_RPC_URL:?Set the read RPC URL}
    PUBLIC_HERALD_URL: ${PUBLIC_HERALD_URL:?Set the official Herald URL}
    VRF_WORKERS: ${VRF_WORKERS:?Choose the stamping worker count}
    L2_GAS_BOUND: ${L2_GAS_BOUND:?Set the fixed play gas bound}
    PLAYER_CAPACITY: ${PLAYER_CAPACITY:-96}
    PRESETS: ${PRESETS:?Name the preset ids this shard registers}
    TRUSTED_PROXY: ${TRUSTED_PROXY:-}
    BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
    HOST_UID: ${HOST_UID:?Set HOST_UID to the host user that owns data/ (id -u)}
    HOST_GID: ${HOST_GID:?Set HOST_GID to that user's group (id -g)}
    OPERATOR_TOKEN_FILE: /opt/athanor/operator-token

services:
  prepare:
    <<: *init
    command: ["prepare"]
  madara:
    image: *madara-image
    entrypoint: ["tini", "--", "/bin/madara"]
    command:
      - --devnet
      - --devnet-contracts=0
      - --base-path=/data
      - --db-fsync
      - --db-wal
      - --chain-config-path=/config/chain-config.yaml
      - --rpc-external
      - --rpc-cors=all
      - --rpc-port=9944
      - --rpc-max-connections=4096
      - --no-charge-fee
      - --l1-sync-disabled
      - --enable-native-execution=true
      - --native-compilation-mode=async
      - --parallel-merkle-enabled
      - --db-max-kept-snapshots=0
      # Upstream 802086d defaults to 15 MiB. Measure the full 2,000-action block before changing it.
      - --otel-collector-endpoint=http://metrics:4317
      - --otel-export-metrics=true
    volumes: ["chain:/data", "public-config:/config:ro"]
    mem_limit: ${NODE_MEMORY:-24g}
    memswap_limit: ${NODE_MEMORY:-24g}
    restart: on-failure
    stop_grace_period: 60s
    depends_on:
      prepare: { condition: service_completed_successfully }
  init:
    <<: *init
    command: ["deploy"]
    depends_on:
      madara: { condition: service_started }
      herald: { condition: service_started }
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: herald
      POSTGRES_DB: herald
      POSTGRES_PASSWORD_FILE: /config/postgres-password
    volumes: ["postgres:/var/lib/postgresql/data", "postgres-config:/config:ro"]
    mem_limit: 512m
    memswap_limit: 512m
    restart: on-failure
    depends_on:
      prepare: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "herald", "-d", "herald"]
      interval: 2s
      timeout: 3s
      retries: 30
  herald:
    image: ${SHARD_HERALD_IMAGE:?Use the published Herald image digest}
    entrypoint: ["/bin/sh", "-ec", "set -a; . /runtime/herald.env; exec bun /app/herald.js"]
    volumes: ["public-config:/config:ro", "herald-config:/runtime:ro"]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HERALD_PORT:-8081}:3003"]
    mem_limit: ${HERALD_MEMORY:-6g}
    memswap_limit: ${HERALD_MEMORY:-6g}
    restart: on-failure
    depends_on:
      prepare: { condition: service_completed_successfully }
      madara: { condition: service_started }
      postgres: { condition: service_healthy }
  rpc:
    image: ${SHARD_HERALD_IMAGE:?Use the published Herald image digest}
    entrypoint: ["/bin/sh", "-ec", "set -a; . /config/proxy.env; exec bun /app/read-rpc.js"]
    environment:
      NODE_RPC_URL: http://madara:9944
      NATIVE_WORLD_MANIFEST: /config/native-world.json
      PORT: "8080"
      VRF_KEY_FILE: /keys/vrf-key.json
      VRF_WORKERS: ${VRF_WORKERS:?Choose the stamping worker count}
      PLAYER_CAPACITY: ${PLAYER_CAPACITY:-96}
    user: "${HOST_UID:?}:${HOST_GID:?}"
    volumes:
      - public-config:/config:ro
      - type: bind
        source: ${SHARD_DATA:-./data}/vrf-key.json
        target: /keys/vrf-key.json
        read_only: true
        bind: { create_host_path: false }
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${RPC_PORT:-8080}:8080"]
    mem_limit: 2g
    memswap_limit: 2g
    restart: on-failure
    depends_on:
      init: { condition: service_completed_successfully, restart: true }

  # The gameplay harness against this shard, from its network, as the host user, so its reports in data/ are the
  # user's: docker compose run --rm harness OPTIONS. HARNESS_CPUSET keeps a large driver off the shard's own CPUs.
  harness:
    <<: *init
    profiles: [harness]
    entrypoint: ["python3", "/app/deploy/shard/init.py", "harness"]
    user: "${HOST_UID:?}:${HOST_GID:?}"
    cpuset: ${HARNESS_CPUSET:-}

  # The shard's own metrics: the node's OTLP export, every container's CPU, as JSON
  # lines under data/metrics. Each file rotates at 100 MB and keeps two older files, 600 MB at most.
  metrics:
    image: ${SHARD_METRICS_IMAGE:?Use the published metrics image digest}
    command: ["--config=/config/collector.json"]
    user: "${HOST_UID:?}:${HOST_GID:?}"
    volumes: ["public-config:/config:ro", "${SHARD_DATA:-./data}/metrics:/data", "/sys/fs/cgroup:/host-cgroup:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    restart: on-failure
    depends_on:
      prepare: { condition: service_completed_successfully }

volumes:
  chain:
  postgres:
  public-config:
  herald-config:
  postgres-config:
