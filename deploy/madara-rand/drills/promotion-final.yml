services:
  journal-replacement:
    profiles: [retired]
  journal-successor:
    depends_on: !reset {}
  journal-witness:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    entrypoint: [/bin/sh, /standby.sh]
    environment:
      PGDATA: /var/lib/postgresql/data
      JOURNAL_UPSTREAM: journal-successor
    volumes:
      - journal-witness:/var/lib/postgresql/data
      - ./journal/standby.sh:/standby.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d randomness"]
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  journal-witness:
