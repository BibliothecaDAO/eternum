services:
  herald-baseline:
    image: ${HERALD_IMAGE:?Set the same Herald release used by the native world}
    restart: unless-stopped
    environment:
      PORT: 3003
      HERALD_CHAIN: madara
      HERALD_RPC_URL: http://madara:9944/rpc/v0_10_2
      HERALD_MANIFEST_PATH: /fixture/manifest.json
      DATABASE_URL: ${BASELINE_DATABASE_URL:?Set the isolated baseline database}
    volumes:
      - ${BASELINE_MANIFEST:?Set the Dojo baseline manifest}:/fixture/manifest.json:ro
    ports: ["127.0.0.1:13005:3003"]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3003/health]
      interval: 1s
      timeout: 3s
      retries: 30
