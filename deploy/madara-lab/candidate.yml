name: athanor-candidate

x-budget: &budget
  cgroup_parent: athanor.slice
  cpuset: "8-11,20-23"
  pids_limit: 2048
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  madara:
    <<: *budget
    image: ${CANDIDATE_MADARA_IMAGE:?Set the candidate image digest}
    mem_limit: 28g
    memswap_limit: 28g
    command:
      - --name=athanor-candidate
      - --devnet
      - --base-path=/data
      - --chain-config-path=/config/chain-config.yaml
      - --rpc-external
      - --rpc-cors=all
      - --rpc-port=9944
      - --no-charge-fee
      - --l1-sync-disabled
      - --enable-native-execution=true
      - --native-compilation-mode=async
    ports: ["127.0.0.1:25050:9944"]
    volumes:
      - type: bind
        source: /opt/athanor/state/chain
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /opt/athanor/config/chain-config.yaml
        target: /config/chain-config.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -m 3 -X POST -H 'content-type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"starknet_blockNumber","params":[]}'
          http://127.0.0.1:9944 >/dev/null
      interval: 5s
      timeout: 4s
      retries: 30
  postgres:
    <<: *budget
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      POSTGRES_USER: candidate
      POSTGRES_DB: candidate
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    ports: ["127.0.0.1:25432:5432"]
    volumes:
      - type: bind
        source: /opt/athanor/state/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: /opt/athanor/config/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, pg_isready, -U, candidate, -d, candidate]
      interval: 5s
      timeout: 3s
      retries: 20
